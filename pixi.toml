[workspace]
name = "rate"
description = "Rad Text Engine -- question answering over radiology text reports"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[activation.env]
# The CLIs run as `python -m src.cli`, from any working directory.
PYTHONPATH = "$PIXI_PROJECT_ROOT"

# The whole pipeline, with no GPU: sglang is the server and nothing under
# `src/` imports it. This code reaches it over HTTP through `openai`.
[dependencies]
python = "3.12.*"
pandas = ">=2.0"
numpy = ">=1.24"
pyyaml = ">=6.0"
tqdm = ">=4.66"
openai = ">=1.0"
pytest = ">=7.0"
ruff = ">=0.1"

# The model host, `pixi install -e server`. Out of `default` because
# `pixi install` solves every environment, and this one needs a GPU and
# several GB of CUDA wheels.
[feature.server]
# No CUDA virtual package: the GPU wheels come from PyPI, so the conda half
# does not need `__cuda` to solve.
platforms = ["linux-64"]

[feature.server.dependencies]
python = "3.12.*"

[feature.server.pypi-dependencies]
sglang = { version = "==0.4.7", extras = ["all"] }
# sglang pins `transformers==4.52.3` and leaves this unbounded, so a resolver
# takes the newest -- and >=0.13.0 imports `transformers.masking_utils`, which
# needs 4.53. 47 of its other requirements are unbounded the same way, held
# still only by the committed lock, and the symptom is always an ImportError
# at launch rather than a solve error.
compressed-tensors = "==0.10.2"

# Keep the backslashes: a raw newline in a pixi `cmd` is a command separator,
# and without them the server launches with no arguments at all.
#
# `--grammar-backend llguidance` with a whitespace pattern, rather than the
# xgrammar default. The JSON grammar lets arbitrary whitespace sit between
# tokens, and sglang 0.4.7 calls `compile_json_schema` without xgrammar's
# `any_whitespace=False`, so a model can emit `\t\n` forever and stay
# grammar-legal. A live run did exactly that: correct fields, then hundreds of
# tabs instead of the closing brace, until `max_tokens`.
# `--constrained-json-whitespace-pattern` is wired into the llguidance and
# outlines backends and not into xgrammar, so the fix needs one of those.
# `[ ]?` allows at most a single space.
#
# llguidance rather than outlines: outlines compiles the schema to a regex and
# then a DFA over the whole 151k-token vocabulary, which stalled the scheduler
# with no prefill at all. llguidance is an incremental parser and compiles per
# schema, not per vocabulary.
#
# No `--reasoning-parser`, which pairs with `enable_thinking: false` in
# `config/default_config.yaml`. The flag makes sglang wrap the grammar backend
# in `ReasonerGrammarBackend`, which enforces nothing until a `</think>` token
# arrives -- so with thinking off the schema would never apply at all. To put
# thinking back, set that config key true and add `--reasoning-parser qwen3`
# here; the two have to move together.
#
# 512 and 512 is the pair measured on four A40s: `cuda graph: True`,
# `token usage` 0.31, 4.4 requests per second. Both numbers matter together --
# `--cuda-graph-max-bs` below the concurrency means every decode batch exceeds
# the captured graphs and runs eager.
#
# 1024 does not fit. The KV cache has room for it (545 tokens resident per
# request against a cache of about 900,000), but graph capture draws on what
# `--mem-fraction-static` leaves behind, and at 1024 it fails:
#
#   Capture cuda graph failed: CUDA out of memory. Tried to allocate 232.00 MiB.
#   GPU 0 has a total capacity of 44.42 GiB of which 191.88 MiB is free.
#
# To go higher, lower `--mem-fraction-static` in the same step, and move one
# number at a time. Re-derive from `#token` and `token usage` on other
# hardware.
[feature.server.tasks.launch-server]
description = "Serve the model the extraction asks over HTTP"
cmd = """
python -m sglang.launch_server \
  --model-path Qwen/Qwen3-30B-A3B \
  --port 8000 \
  --host 127.0.0.1 \
  --tp 4 \
  --schedule-conservativeness 0.1 \
  --attention-backend triton \
  --sampling-backend pytorch \
  --grammar-backend llguidance \
  --constrained-json-whitespace-pattern "[ ]?" \
  --max-running-requests 512 \
  --cuda-graph-max-bs 512 \
  --mem-fraction-static 0.80
"""

[feature.server.activation.env]
PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True"

[environments]
server = { features = ["server"], no-default-feature = true }

[tasks]
extract = { cmd = "python -m src.cli", description = "Run the extraction stages over a set of reports" }
qc = { cmd = "python -m src.qc_cli", description = "Draw the sheets a human annotates" }
evaluate = { cmd = "python -m src.eval_cli", description = "Score the annotated sheets" }
vote = { cmd = "python -m src.vote_cli", description = "Collapse a finding's wordings into one answer per report" }
regrade = { cmd = "python -m src.regrade_cli", description = "Rebuild the graded columns from the stored answers, after a lexicon edit" }
audit = { cmd = "python -m src.audit_cli", description = "Report what a finished extraction holds, in counts alone" }
test = { cmd = "pytest", description = "The test suite" }
# Scoped to `tests`: `ruff check src` reports 738 pre-existing findings.
# Widen once `src` is clean.
lint = { cmd = "ruff check tests", description = "ruff check" }
