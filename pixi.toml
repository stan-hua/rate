[workspace]
name = "rate"
description = "Rad Text Engine -- question answering over radiology text reports"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[activation.env]
# The CLIs run as `python -m src.cli`, from any working directory.
PYTHONPATH = "$PIXI_PROJECT_ROOT"

# The whole pipeline, with no GPU: sglang is the server and nothing under
# `src/` imports it. This code reaches it over HTTP through `openai`.
[dependencies]
python = "3.12.*"
pandas = ">=2.0"
numpy = ">=1.24"
pyyaml = ">=6.0"
tqdm = ">=4.66"
openai = ">=1.0"
pytest = ">=7.0"
ruff = ">=0.1"

# The model host, `pixi install -e server`. Out of `default` because
# `pixi install` solves every environment, and this one needs a GPU and
# several GB of CUDA wheels.
[feature.server]
# No CUDA virtual package: the GPU wheels come from PyPI, so the conda half
# does not need `__cuda` to solve.
platforms = ["linux-64"]

[feature.server.dependencies]
python = "3.12.*"

[feature.server.pypi-dependencies]
sglang = { version = "==0.4.7", extras = ["all"] }
# sglang pins `transformers==4.52.3` and leaves this unbounded, so a resolver
# takes the newest -- and >=0.13.0 imports `transformers.masking_utils`, which
# needs 4.53. 47 of its other requirements are unbounded the same way, held
# still only by the committed lock, and the symptom is always an ImportError
# at launch rather than a solve error.
compressed-tensors = "==0.10.2"

# Keep the backslashes: a raw newline in a pixi `cmd` is a command separator,
# and without them the server launches with no arguments at all.
#
# The two batch-size limits are sized for four A40s, at about 0.76 of the KV
# cache. Re-derive them from `#token` and `token usage` in the server log on
# other hardware; past capacity sglang retracts and re-prefills requests.
[feature.server.tasks.launch-server]
description = "Serve the model the extraction asks over HTTP"
cmd = """
python -m sglang.launch_server \
  --model-path Qwen/Qwen3-30B-A3B \
  --reasoning-parser qwen3 \
  --port 8000 \
  --host 127.0.0.1 \
  --tp 4 \
  --schedule-conservativeness 0.1 \
  --attention-backend triton \
  --sampling-backend pytorch \
  --max-running-requests 512 \
  --cuda-graph-max-bs 512 \
  --mem-fraction-static 0.80
"""

[feature.server.activation.env]
PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True"

[environments]
server = { features = ["server"], no-default-feature = true }

[tasks]
extract = { cmd = "python -m src.cli", description = "Run the extraction stages over a set of reports" }
qc = { cmd = "python -m src.qc_cli", description = "Draw the sheets a human annotates" }
evaluate = { cmd = "python -m src.eval_cli", description = "Score the annotated sheets" }
vote = { cmd = "python -m src.vote_cli", description = "Collapse a finding's wordings into one answer per report" }
test = { cmd = "pytest", description = "The test suite" }
# Scoped to `tests`: `ruff check src` reports 738 pre-existing findings.
# Widen once `src` is clean.
lint = { cmd = "ruff check tests", description = "ruff check" }
