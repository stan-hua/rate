# How firmly a report states a finding, as a phrase-to-level map.
#
# There is no agreed standard. The ACR Commission on Quality and Safety
# reports insufficient agreement to recommend one scale, so this follows the
# Memorial Sloan Kettering lexicon of Panicek and Hricak (AJR 2016), the most
# cited of them, collapsed from five points to three. Their approximate
# probabilities are in the comments.
#
# The level is computed from the phrase after extraction, never asked of the
# model, so changing a mapping is an edit here and not a re-run of 4 million
# requests.
#
# `concerning for` is at medium deliberately. The project's annotator placed it
# at the bottom of their own scale, and the radiologists surveyed in the
# literature put "concerning" at about 75%, alongside "suspicious" and
# "probably". Following the literature means some early annotations understate
# their rows, acute cholecystitis most of all.
version: 1

levels:
  # > 90%: the report states the finding
  high:
    - consistent with
    - compatible with
    - diagnostic of
    - characteristic of
    - typical of
    - represents
    - demonstrates
    - consistent in appearance with
    # The ACR term survey puts "highly suspicious" in its top band with
    # "diagnostic of" and "consistent with", above the bare forms below.
    - highly suspicious
    - highly suspicious for
    - highly suggestive
    - highly suggestive of
    - in keeping with
    - indicative of

  # ~ 75%: the report leans on it
  medium:
    - suspicious for
    - concerning for
    - worrisome for
    - probable
    - probably
    # A smoke run quoted the bare verb, which the two full idioms below do
    # not match, so the row graded `unspecified`.
    - favored
    - favors
    - favored to be
    - favored to represent
    - most likely
    - likely
    - similar in appearance to
    # The same survey puts "suggestive" in the ~75% band beside "suspicious".
    # Absent until 2026-11-09, so "Nodular contour suggestive of cirrhosis"
    # graded `unspecified`.
    - suggestive of
    - suggestive
    - suggesting
    - suggests
    - presumed
    - presumably
    - felt to represent
    - thought to represent

  # ~ 50%: the report raises it
  low:
    - possible
    - possibly
    - may represent
    - may reflect
    - may be
    - could represent
    - cannot be excluded
    - cannot exclude
    - not excluded
    - differential includes
    - questionable
    # Longer forms the whole-word match does not reach from the entries above:
    # "cannot be excluded" is not a substring of "cannot be definitively
    # excluded", and "possible" is a different word from "possibility".
    - cannot be definitively excluded
    - cannot be entirely excluded
    - not entirely excluded
    - cannot be ruled out
    - cannot rule out
    - possibility
    - raises the possibility
    - equivocal
    - may indicate
    - could be
    - versus
    - vs
    - vs.

# <= 25%, and below the scale. A report that raises a finding only to set it
# aside has not reported it, so these map to an absent answer rather than to a
# low certainty.
negated:
  - less likely
  # Parallel to `less likely`, and longer than the `favored` above, so it
  # wins the longest-phrase match.
  - less favored
  - not favored
  # Absent from this list until 2026-11-09, and the substring fallback landed
  # it on `medium` through `likely` -- the opposite of what it means.
  - not likely
  - unlikely
  - very unlikely
  - doubt
  - doubtful
  - no evidence of
  - without evidence of
  - no definite
  - no definite evidence of
  - rather than

# Open families an exact phrase cannot close. The first match wins and these
# are read after every exact phrase above, so a listed phrase always decides
# its own level and these catch the rest of its family.
#
# Added 2026-11-09, after a run returned "may relate to" where the file listed
# `may represent`, `may reflect`, `may be` and `may indicate`.
patterns:
  # Negations first, because they contain the families they negate.
  - pattern: '(?i)\b(?:may|might|could)\s+not\b'
    level: negated
  - pattern: '(?i)\bnot\s+(?:necessarily|certainly)\b'
    level: negated

  # "suggestive of", "suggesting", "suggests", "is suggested by".
  - pattern: '(?i)\bsuggest(?:s|ed|ing|ive)?\b'
    level: medium
  - pattern: '(?i)\b(?:favor|favour)(?:s|ed|ing)?\b'
    level: medium
  - pattern: '(?i)\b(?:thought|felt|presumed|believed)\s+to\b'
    level: medium

  # "may relate to", "may correspond to", "could arise from", "might reflect".
  - pattern: '(?i)\b(?:may|might|could)\s+\w+'
    level: low
  - pattern: '(?i)\bcannot\s+(?:be\s+)?\w*\s*(?:exclude|excluded|rule|ruled)\b'
    level: low
  - pattern: '(?i)\bpossib(?:le|ly|ility)\b'
    level: low
