        question: "Is there any pleural effusion?"
        variants:
          - "Is there pleural fluid?"
          - "Does the report describe a pleural effusion?"
        definition: "Fluid lies in a pleural space at a visible lung base. Pleural thickening with no fluid does not count."
      - id: any_pleura
        question: "Is there any abnormality of the pleural spaces or lung bases?"
        variants:
          - "Does the report describe any abnormality of the pleural spaces or lung bases?"
        definition: "Anything the report records as abnormal in a pleural space or a visible lung base, including a finding the specific questions do not cover. Operative change counts, and so does an organ surgically absent. A device alone does not count where the organ is otherwise normal. A normal anatomical variant counts where the report records it. The question covers only the lung bases inside the imaged volume."
        include_terms:
          - "a pleural effusion or pleural fluid"
          - "pleural thickening or a pleural plaque"
          - "atelectasis, basilar collapse or volume loss"
          - "consolidation or an airspace opacity"
          - "a pulmonary nodule or mass at a visible lung base"
          - "a pneumothorax"
  Urinary tract:
    description: "Ureter and bladder findings"
    questions:
      - id: ureteral_stones
        question: "Are there any ureteral stones?"
        variants:
          - "Is there ureterolithiasis or a ureteric calculus?"
          - "Does the report describe ureteral stones?"
        definition: "A calculus in a ureter, at any level including the ureterovesical junction."
        include_terms:
          - "ureteral stone"
          - "ureterolithiasis"
          - "UVJ stone"
          - "ureteric calculus"
        exclude_terms:
          - "renal stone"
          - "nephrolithiasis"
          - "bladder stone"
      - id: bladder_stones
        question: "Are there any bladder stones?"
        variants:
          - "Is there a bladder calculus or a vesical calculus?"
          - "Does the report describe bladder stones?"
        definition: "A calculus in the bladder, including one in a bladder diverticulum. A stone at the ureterovesical junction counts as ureteral."
        include_terms:
          - "bladder stone"
          - "bladder calculus"
          - "vesical calculus"
        exclude_terms:
          - "ureteral stone"
          - "UVJ stone"
          - "renal stone"
      - id: ureteroceles
        question: "Are there any ureteroceles?"
        variants:
          - "Does the report describe ureteroceles?"
        definition: "The distal ureter balloons into the bladder lumen as a cystic dilation. A ureteral stone at the ureterovesical junction does not count."
      - id: bladder_tcc
        question: "Are there any urothelial carcinomas of the bladder?"
        variants:
          - "Does the report describe a bladder urothelial carcinoma?"
        definition: "A malignant tumour of the bladder urothelium, which the report names a urothelial or a transitional cell carcinoma. Bladder wall thickening with no named malignancy does not count."
      - id: bladder_rupture
        question: "Is there bladder rupture?"
        variants:
          - "Is there bladder perforation?"
          - "Does the report describe bladder rupture?"
        definition: "The bladder wall is breached: contrast or urine leaks, intraperitoneally or extraperitoneally, or the report names a rupture or a perforation."
      - id: any_urinary_tract
        question: "Is there any abnormality of the ureters or bladder?"
        variants:
          - "Does the report describe any abnormality of the ureters or bladder?"
        definition: "Anything the report records as abnormal in a ureter or the bladder, including a finding the specific questions do not cover. Operative change counts, and so does an organ surgically absent. A device alone does not count where the organ is otherwise normal. A normal anatomical variant counts where the report records it. The kidneys are a separate compartment."
        include_terms:
          - "ureteral dilation or hydroureter"
          - "a ureteral or bladder stone"
          - "bladder wall thickening or trabeculation"
          - "a bladder mass"
        exclude_terms:
          - "a catheter, stent, drain, graft or other device, where the organ is otherwise normal"
