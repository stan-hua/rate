        variants:
          - "Does the report describe aortic atherosclerosis?"
        definition: "The aortic wall is atherosclerotic: calcified or mural plaque, or a wall the report describes as atheromatous or atherosclerotic. A dilated or aneurysmal aorta has its own question."
        include_terms:
