  Retroperitoneum:
    description: "Retroperitoneal space findings"
    questions:
      - id: lymphadenopathy
        question: "Is there any lymphadenopathy in retroperitoneum, peritoneum or pelvis?"
        variants:
          - "Are there enlarged lymph nodes in the retroperitoneum, the peritoneum or the pelvis?"
          - "Does the report describe any lymphadenopathy in the retroperitoneum, peritoneum or pelvis?"
        definition: "A lymph node in the retroperitoneum, the peritoneum or the pelvis is enlarged, or the report names lymphadenopathy at one of those sites. A node the report calls normal in size does not count."
      - id: retroperitoneal_hemorrhage
        question: "Is there retroperitoneal hemorrhage or retroperitoneal hematomas?"
        variants:
          - "Does the report describe retroperitoneal hemorrhage or retroperitoneal hematomas?"
        definition: "Blood lies in the retroperitoneum: a hematoma, active bleeding, or high-density fluid the report attributes to haemorrhage. A psoas or perinephric hematoma counts."
      

      - id: any_retroperitoneum
        question: "Is there any abnormality of the retroperitoneum?"
        variants:
          - "Does the report describe any abnormality of the retroperitoneum?"
        definition: "Anything the report records as abnormal in the retroperitoneum, including a finding the specific questions do not cover. Operative change counts, and so does an organ surgically absent. A device alone does not count where the organ is otherwise normal. A normal anatomical variant counts where the report records it. Free fluid inside the peritoneal cavity answers the peritoneum question."
        include_terms:
          - "retroperitoneal fluid or hemorrhage"
          - "retroperitoneal lymphadenopathy"
          - "retroperitoneal fibrosis"
          - "a retroperitoneal mass or collection"
