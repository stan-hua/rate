modality: "fast_abdominal_ct"

# Define findings categories and their associated questions
categories:
  Pancreas:
    description: "Pancreas-related findings"
    questions:
      - id: acute_pancreatitis
        question: "Is there acute pancreatitis?"
        variants:
          - "According to the report, is there acute pancreatitis?"
        definition: "Acute pancreatitis is defined as acute inflammation of the pancreas, with peripancreatic fat stranding or fluid, diffuse glandular enlargement, or a non-enhancing parenchymal segment. This definition includes an acute episode on a chronic background, necrosis, a peripancreatic collection and a walled-off collection. This definition excludes chronic pancreatitis alone, whose signs are glandular atrophy, parenchymal or ductal calcification, and ductal dilation."
        severity_scale: "mild, moderate or severe"
      

      - id: any_pancreas
        question: "Is there any abnormality of the pancreas?"
        variants:
          - "According to the report, is there any abnormality of the pancreas?"
        definition: "An abnormality of the pancreas is defined as any abnormal finding in the pancreas. This definition includes operative change, a resected part of the pancreas and a normal anatomical variant. This definition excludes a device where nothing else is abnormal."
        include_terms:
          - "pancreatitis or peripancreatic inflammation"
          - "a pancreatic mass, cyst or pseudocyst"
          - "pancreatic ductal dilation"
          - "pancreatic atrophy or calcification"
  Spleen:
    description: "Spleen-related findings"
    questions:
      - id: splenomegaly
        question: "Is there splenomegaly?"
        variants:
          - "Is the spleen enlarged?"
          - "According to the report, is there splenomegaly?"
        definition: "Splenomegaly is defined as an enlarged spleen. No single CT measurement defines it. This definition excludes a spleen called normal in size, whatever its measurement."
        severity_scale: "mild, moderate or marked"
      - id: epithelial_splenic_cysts
        question: "Are there any epithelial splenic cysts?"
        variants:
          - "According to the report, are there any epithelial splenic cysts?"
        definition: "An epithelial splenic cyst is defined as a true splenic cyst with an epithelial lining, congenital or epidermoid, thin-walled and of fluid attenuation. This definition includes a splenic cyst with no cause given. This definition excludes a post-traumatic, post-infarction or post-infectious cyst."
      - id: splenic_pseudocyst
        question: "Are there any splenic pseudocysts?"
        variants:
          - "According to the report, are there any splenic pseudocysts?"
        definition: "A splenic pseudocyst is defined as a splenic cyst with no epithelial lining, following trauma, infarction or infection. This definition excludes a congenital or epidermoid cyst, and a splenic cyst with no cause given."
      - id: splenic_lymphoma
        question: "Is splenic lymphoma present?"
        variants:
          - "Is there lymphomatous involvement of the spleen?"
          - "According to the report, is splenic lymphoma present?"
        definition: "Splenic lymphoma is defined as lymphomatous involvement of the spleen, with splenic masses or diffuse infiltration in a patient with lymphoma. This definition excludes splenomegaly alone."
      - id: splenic_laceration
        question: "Are there any splenic lacerations?"
        variants:
          - "According to the report, are there any splenic lacerations?"
        definition: "A splenic laceration is defined as torn splenic parenchyma: a laceration, a fracture, or a shattered spleen. This definition excludes a subcapsular or perisplenic hematoma with no parenchymal tear."
      - id: splenic_infarct
        question: "Are there any splenic infarcts?"
        variants:
          - "According to the report, are there any splenic infarcts?"
        definition: "A splenic infarct is defined as a non-enhancing area of splenic parenchyma, wedge-shaped or global, from vascular occlusion. This definition excludes a devascularized segment attributed to trauma."
      - id: spleen_absent
        question: "Is the spleen absent?"
        variants:
          - "According to the report, is the spleen absent?"
        definition: "An absent spleen is defined as no spleen in the splenic fossa, from any cause. This definition includes a splenectomy, congenital asplenia, and an autosplenectomy."
        include_terms:
          - "splenectomy"
          - "surgically absent spleen"
          - "asplenia"
          - "absent spleen"
      - id: accessory_spleen
        question: "Are there any accessory spleens?"
        variants:
          - "Is there a splenule?"
          - "According to the report, are there any accessory spleens?"
        definition: "An accessory spleen is defined as a splenule, a small round nodule of splenic tissue near the splenic hilum, in the splenic ligaments, or in the pancreatic tail. This definition excludes splenosis after a splenectomy."
        include_terms:
          - "splenule"
          - "splenunculus"
          - "accessory spleen"
          - "intrapancreatic accessory spleen"

      - id: splenic_subcapsular_hemorrhage
        question: "Are there any splenic subcapsular hematomas or hemorrhages?"
        variants:
          - "According to the report, are there any splenic subcapsular hematomas or hemorrhages?"
        definition: "Splenic subcapsular hemorrhage is defined as blood between the splenic capsule and the parenchyma, flattening it. This definition excludes perisplenic blood outside the capsule, and a parenchymal tear."
        include_terms:
          - "splenic subcapsular hematoma"
          - "subcapsular hematoma of the spleen"
        exclude_terms:
          - "perisplenic hematoma"
          - "splenic laceration"
      - id: active_extravasation_spleen
        question: "Are there any sites of active extravasation in the spleen?"
        variants:
          - "According to the report, are there any sites of active extravasation in the spleen?"
        definition: "Active extravasation in the spleen is defined as contrast material leaking from a vessel into the splenic parenchyma or around it, as a contrast blush or a jet of extravasated contrast. This definition includes a pseudoaneurysm that is actively leaking. This definition excludes a hematoma with no contrast leak."
      - id: post_splenectomy_changes
        question: "Are there any post-splenectomy changes in the splenic bed?"
        variants:
          - "According to the report, are there any post-splenectomy changes in the splenic bed?"
        definition: "Post-splenectomy change is defined as operative change in the splenic bed after a splenectomy: clips or sutures, a surgical bed or cavity, or splenosis. This definition excludes an absent spleen with no operative change."
        include_terms:
          - "post-splenectomy change"
          - "splenectomy clips"
          - "clips or a surgical bed in the splenic fossa"
          - "splenosis"
          - "surgical bed in the left upper quadrant"
        exclude_terms:
          - "asplenia"
          - "congenitally absent spleen"
      - id: any_spleen
        question: "Is there any abnormality of the spleen?"
        variants:
          - "According to the report, is there any abnormality of the spleen?"
        definition: "An abnormality of the spleen is defined as any abnormal finding in the spleen. This definition includes operative change, a surgically absent spleen and a normal anatomical variant. This definition excludes a device where nothing else is abnormal."
        include_terms:
          - "splenomegaly"
          - "a splenic lesion, cyst or mass"
          - "a splenic infarct"
          - "splenic injury, laceration or hematoma"
          - "a surgically absent spleen, or a prior splenectomy"
  Biliary Tree:
    description: "Biliary tree-related findings"
    questions:
      - id: intrahepatic_duct_dilation
        question: "Is there any intrahepatic biliary ductal dilation?"
        variants:
          - "According to the report, is there any intrahepatic biliary ductal dilation?"
        definition: "Intrahepatic biliary ductal dilation is defined as dilated, prominent or obstructed intrahepatic bile ducts. This definition excludes a dilated extrahepatic duct beside normal intrahepatic ducts."
      - id: extrahepatic_duct_dilation
        question: "Is there any extrahepatic biliary ductal dilation?"
        variants:
          - "According to the report, is there any extrahepatic biliary ductal dilation?"
        definition: "Extrahepatic biliary ductal dilation is defined as dilation of the common hepatic duct, the common bile duct, or both. This definition includes a common bile duct wider than about 6 mm, allowing roughly 1 mm per decade over 60 and up to about 10 mm after a cholecystectomy. This definition excludes a dilated intrahepatic duct beside a normal common duct."

      - id: any_biliary
        question: "Is there any abnormality of the bile ducts?"
        variants:
          - "According to the report, is there any abnormality of the bile ducts?"
        definition: "An abnormality of the bile ducts is defined as any abnormal finding in the bile ducts. This definition includes operative change and a normal anatomical variant. This definition excludes the gallbladder, and a device where nothing else is abnormal."
        include_terms:
          - "intrahepatic or extrahepatic ductal dilation"
          - "a duct stone or choledocholithiasis"
          - "pneumobilia"
          - "a biliary stricture"
  Liver:
    description: "Liver-related findings"
    questions:
      - id: hepatomegaly
        question: "Is there hepatomegaly?"
        variants:
          - "According to the report, is there hepatomegaly?"
        definition: "Hepatomegaly is defined as an enlarged liver. No single CT measurement defines it. This definition excludes a liver called normal in size, whatever its measurement."
        severity_scale: "mild, moderate or marked"
      - id: hepatic_steatosis
        question: "Is there hepatic steatosis, fatty liver or focal fatty infiltration?"
        variants:
          - "Is the liver fatty or steatotic?"
          - "According to the report, is there hepatic steatosis, fatty liver or focal fatty infiltration?"
        definition: "Hepatic steatosis is defined as fatty infiltration of the liver, diffuse or focal."
        include_terms:
          - "hepatic steatosis"
          - "fatty liver"
          - "fatty infiltration"
          - "hepatic fat"
        severity_scale: "mild, moderate or marked"
      - id: cirrhosis
        question: "Is there cirrhosis?"
        variants:
          - "According to the report, is there cirrhosis?"
        definition: "Cirrhosis is defined as cirrhotic morphology of the liver: a nodular contour, a shrunken right lobe, or hypertrophy of the caudate or the left lobe. This definition excludes hepatic steatosis alone and chronic liver disease short of cirrhosis."
      - id: cirrhosis_portal_hypertension
        question: "Is there portal hypertension?"
        variants:
          - "According to the report, is there portal hypertension?"
        definition: "Portal hypertension is defined as raised portal venous pressure, with a portosystemic collateral: esophageal, gastric, splenorenal or mesenteric varices, or a recanalized paraumbilical vein. This definition excludes splenomegaly alone, ascites alone, and a dilated portal vein alone."
        include_terms:
          - "portal hypertension"
          - "portosystemic collaterals"
      - id: gastroesophageal_varices
        question: "Are there any esophageal or gastric varices?"
        variants:
          - "According to the report, are there any esophageal or gastric varices?"
        definition: "Gastroesophageal varices are defined as dilated submucosal collateral veins at the esophagus or the gastric fundus. This definition excludes portosystemic collaterals elsewhere."
      - id: polycystic_liver_disease
        question: "Is polycystic liver disease present?"
        variants:
          - "According to the report, is polycystic liver disease present?"
        definition: "Polycystic liver disease is defined as innumerable hepatic cysts replacing the parenchyma, including hepatic involvement of autosomal dominant polycystic kidney disease. This definition includes more than 20 cysts. This definition excludes a few scattered cysts."
      - id: hepatic_abscess
        question: "Are there any hepatic abscesses?"
        variants:
          - "Are there any liver abscesses?"
          - "According to the report, are there any hepatic abscesses?"
        definition: "A hepatic abscess is defined as an infected collection in the liver, rim-enhancing or multiloculated. This definition excludes a simple cyst."
      - id: hepatic_cysts_simple
        question: "Are there any hepatic cysts?"
        variants:
          - "Are there any liver cysts?"
          - "According to the report, are there any hepatic cysts?"
        definition: "A simple hepatic cyst is defined as a thin-walled hepatic cyst of fluid attenuation, with no septation, no calcification and no solid component. This definition includes a hepatic cyst with no further description. This definition excludes an abscess, a cystic metastasis, a complex cystic lesion, and polycystic liver disease."
      - id: hepatic_hemangioma
        question: "Are there any hepatic hemangiomas?"
        variants:
          - "Is there a liver hemangioma?"
          - "According to the report, are there any hepatic hemangiomas?"
        definition: "A hepatic hemangioma is defined as a benign vascular lesion of the liver."
      - id: hepatic_adenoma
        question: "Are there any hepatic adenomas?"
        variants:
          - "Is there a hepatocellular adenoma?"
          - "According to the report, are there any hepatic adenomas?"
        definition: "A hepatic adenoma is defined as a hepatocellular adenoma, a benign neoplasm of hepatocytes. This definition excludes focal nodular hyperplasia."
      - id: hepatic_mass_indeterminate
        question: "Are there any indeterminate hepatic masses?"
        variants:
          - "Are there any indeterminate liver masses?"
          - "According to the report, are there any indeterminate hepatic masses?"
        definition: "An indeterminate hepatic mass is defined as a solid hepatic mass of undetermined nature. This definition excludes a cyst, a lesion with a specific diagnosis such as a hemangioma, a metastasis or a hepatocellular carcinoma, and a hypodensity left uncharacterized."
        include_terms:
          - "indeterminate hepatic lesion"
          - "indeterminate liver mass"
          - "solid hepatic lesion"
          - "hepatic mass"
        exclude_terms:
          - "hepatic cyst"
          - "simple cyst"
          - "hemangioma"
          - "metastasis"
          - "hepatocellular carcinoma"
          - "hypodensity"
          - "too small to characterize"
      - id: hepatocellular_carcinoma_hcc
        question: "Is there hepatocellular carcinoma?"
        variants:
          - "Is there a hepatoma?"
          - "According to the report, is there hepatocellular carcinoma?"
        definition: "Hepatocellular carcinoma is defined as a primary malignant neoplasm of hepatocytes, also called a hepatoma. This definition excludes a regenerative or dysplastic nodule and a lesion left uncharacterized."
      - id: hepatic_metastases
        question: "Are there any hepatic metastases?"
        variants:
          - "Are there any liver metastases?"
          - "According to the report, are there any hepatic metastases?"
        definition: "A hepatic metastasis is defined as a secondary malignant deposit in the liver. This definition excludes a solid lesion left uncharacterized."
      - id: liver_laceration
        question: "Are there any liver lacerations?"
        variants:
          - "Is there a hepatic laceration?"
          - "According to the report, are there any liver lacerations?"
        definition: "A liver laceration is defined as torn hepatic parenchyma: a laceration, a fracture, or a devascularized segment. This definition excludes a subcapsular or perihepatic hematoma with no parenchymal injury."
      - id: active_extravasation_liver
        question: "Are there any sites of active extravasation in the liver?"
        variants:
          - "Is there active hemorrhage or a contrast blush in the liver?"
          - "According to the report, are there any sites of active extravasation in the liver?"
        definition: "Active extravasation in the liver is defined as contrast material leaking from a vessel into the hepatic parenchyma or around it, as a contrast blush or a jet of extravasated contrast. This definition includes a pseudoaneurysm that is actively leaking. This definition excludes a hematoma with no contrast leak."
      - id: prior_liver_resection
        question: "Is there a prior liver resection?"
        variants:
          - "Is there a prior hepatectomy?"
          - "According to the report, is there a prior liver resection?"
        definition: "A prior liver resection is defined as surgical removal of part of the liver: a resection margin or surgical plane, clips or sutures at the cut surface, a post-surgical cavity or seroma, or hypertrophy of the remnant. This definition includes a segmentectomy, a partial hepatectomy and a lobectomy. This definition excludes a small or atrophic liver with no sign of surgery and a transplanted liver."
      - id: post_liver_transplant
        question: "Are there any hepatic changes post-transplantation?"
        variants:
          - "Is there a hepatic allograft?"
          - "According to the report, are there any hepatic changes post-transplantation?"
        definition: "A liver transplant is defined as a transplanted liver, or operative change from one, such as a vascular or biliary anastomosis. This definition excludes a hepatic resection."
      - id: portal_venous_occlusion_thrombosis
        question: "Is there portal venous thrombosis or occlusion?"
        variants:
          - "Is the portal vein thrombosed or occluded?"
          - "According to the report, is there portal venous thrombosis or occlusion?"
        definition: "Portal venous thrombosis is defined as thrombus in the main portal vein or its intrahepatic branches, occlusive or not. This definition includes a chronically occluded vein, cavernous transformation, tumor thrombus, and thrombus at the splenoportal confluence that extends into the portal vein. This definition excludes thrombus confined to the splenic vein or the superior mesenteric vein while the portal vein is patent."
      - id: portal_venous_gas
        question: "Is there any portal venous gas?"
        variants:
          - "Is there portal venous air?"
          - "According to the report, is there any portal venous gas?"
        definition: "Portal venous gas is defined as gas in the portal vein or its intrahepatic branches, extending to the periphery of the liver. This definition excludes central gas in the bile ducts, which does not extend to the periphery."
      
      
      - id: hepatic_subcapsular_hemorrhage
        question: "Are there any hepatic subcapsular hematomas or hemorrhages?"
        variants:
          - "According to the report, are there any hepatic subcapsular hematomas or hemorrhages?"
        definition: "Hepatic subcapsular hemorrhage is defined as blood between the hepatic capsule and the parenchyma, flattening it. This definition excludes perihepatic blood outside the capsule, and a parenchymal tear."
        include_terms:
          - "hepatic subcapsular hematoma"
          - "subcapsular hematoma of the liver"
        exclude_terms:
          - "perihepatic hematoma"
          - "liver laceration"
      - id: hepatic_hypodensities
        question: "Are there any hepatic hypodensities?"
        variants:
          - "According to the report, are there any hepatic hypodensities?"
        definition: "A hepatic hypodensity is defined as a hypoattenuating lesion in the liver, of any cause, whatever name the lesion is given. This definition includes a simple cyst, an indeterminate mass, and a hypodensity left uncharacterized. This definition excludes a lesion described as hyperdense or isodense, and a lesion described only as a solid enhancing mass with no low-attenuation component."
        include_terms:
          - "hepatic hypodensity"
          - "hypodensity in the liver"
          - "hypoattenuating hepatic lesion"
          - "low-density hepatic lesion"
          - "too small to characterize"
      - id: any_liver
        question: "Is there any abnormality of the liver?"
        variants:
          - "According to the report, is there any abnormality of the liver?"
        definition: "An abnormality of the liver is defined as any abnormal finding in the liver. This definition includes operative change, a resected part of the liver, a transplanted liver and a normal anatomical variant. This definition excludes the bile ducts, the gallbladder, and a device where nothing else is abnormal."
        include_terms:
          - "hepatic steatosis or a fatty liver"
          - "a hepatic lesion, cyst or mass"
          - "cirrhosis or a nodular hepatic contour"
          - "hepatomegaly"
          - "hepatic injury, laceration or hematoma"
  Gallbladder:
    description: "Gallbladder-related findings"
    questions:
      - id: gallbladder_stones
        question: "Are there any gallbladder stones or cholelithiasis?"
        variants:
          - "Are there any gallstones?"
          - "According to the report, are there any gallbladder stones or cholelithiasis?"
        definition: "A gallstone is defined as a calculus in the gallbladder. This definition excludes sludge alone, and a stone in the cystic duct or the common bile duct."
      - id: gallbladder_surgically_absent
        question: "Is the gallbladder surgically absent?"
        variants:
          - "Is there a prior cholecystectomy?"
          - "According to the report, is the gallbladder surgically absent?"
        definition: "A surgically absent gallbladder is defined as a gallbladder removed at a cholecystectomy. This definition includes surgical clips in an empty gallbladder fossa, and biliary ductal dilation attributed to a postcholecystectomy state. This definition excludes a contracted or poorly distended gallbladder, and a normal or unremarkable gallbladder, which the patient still has."
      - id: choledochal_cysts
        question: "Are there any choledochal cysts?"
        variants:
          - "According to the report, are there any choledochal cysts?"
        definition: "A choledochal cyst is defined as a congenital cystic dilation of the bile duct, of any Todani type, including Caroli disease of the intrahepatic ducts. This definition excludes acquired dilation from obstruction, and a dilated duct beside a stone or a mass."
      - id: acute_cholecystitis
        question: "Is there acute cholecystitis?"
        variants:
          - "According to the report, is there acute cholecystitis?"
        definition: "Acute cholecystitis is defined as acute inflammation of the gallbladder: wall thickening together with pericholecystic fluid or fat stranding, or mural hyperenhancement, or gallbladder distension with a stone impacted at the neck. This definition includes acalculous cholecystitis, and an acute episode on a chronic background. This definition excludes gallstones alone, and chronic cholecystitis alone, whose signs are a contracted, thick-walled gallbladder with stones."
      - id: cholecystitis_with_rupture
        question: "Is there acute cholecystitis with rupture?"
        variants:
          - "Is there acute cholecystitis with gallbladder perforation?"
          - "According to the report, is there acute cholecystitis with rupture?"
        definition: "Acute cholecystitis with rupture is defined as acute cholecystitis with a breach of the gallbladder wall: a perforation, a wall defect, or a pericholecystic abscess from a perforated gallbladder. This definition excludes a traumatic rupture with no cholecystitis."
      - id: emphysematous_cholecystitis
        question: "Is there emphysematous cholecystitis?"
        variants:
          - "According to the report, is there emphysematous cholecystitis?"
        definition: "Emphysematous cholecystitis is defined as acute cholecystitis with gas in the gallbladder wall or lumen. This definition excludes gas in the bile ducts alone."
      - id: porcelain_gallbladder
        question: "Is there porcelain gallbladder?"
        variants:
          - "According to the report, is there porcelain gallbladder?"
        definition: "A porcelain gallbladder is defined as extensive or complete calcification of the gallbladder wall. This definition excludes a single mural calcification, and a calcified stone."
      - id: pneumobilia
        question: "Is there pneumobilia?"
        variants:
          - "Is there aerobilia?"
          - "According to the report, is there pneumobilia?"
        definition: "Pneumobilia is defined as gas in the biliary tree: the intrahepatic ducts, the extrahepatic ducts, or the gallbladder lumen. This definition excludes gas in the gallbladder wall, and gas in the portal or mesenteric veins."
        include_terms:
          - "pneumobilia"
          - "biliary gas"
          - "air in the biliary tree"
          - "aerobilia"
      - id: gallbladder_wall_thickening
        question: "Is there diffuse gallbladder wall thickening?"
        variants:
          - "According to the report, is there diffuse gallbladder wall thickening?"
        definition: "Gallbladder wall thickening is defined as diffuse thickening of the gallbladder wall. This definition includes a wall measuring more than 3 mm. This definition excludes thickening attributed to adenomyomatosis, whether focal, segmental or diffuse, and a contracted or underdistended gallbladder whose wall only appears thick."
        include_terms:
          - "gallbladder wall thickening"
          - "thickened gallbladder wall"
        exclude_terms:
          - "adenomyomatosis"
          - "Rokitansky-Aschoff"
        severity_scale: "mild, moderate or marked"
      - id: gallbladder_adenomyomatosis
        question: "Is there gallbladder adenomyomatosis?"
        variants:
          - "According to the report, is there gallbladder adenomyomatosis?"
        definition: "Gallbladder adenomyomatosis is defined as a thickened gallbladder wall containing intramural diverticula or Rokitansky-Aschoff sinuses, fundal, segmental or diffuse."
        include_terms:
          - "adenomyomatosis"
          - "adenomyomatous"
          - "Rokitansky-Aschoff"
      - id: gallbladder_cancer
        question: "Is there gallbladder cancer?"
        variants:
          - "Is there gallbladder carcinoma?"
          - "According to the report, is there gallbladder cancer?"
        definition: "Gallbladder cancer is defined as a malignant tumor of the gallbladder, including a mass arising from the wall. This definition excludes a polyp with no malignant diagnosis."

      - id: any_gallbladder
        question: "Is there any abnormality of the gallbladder?"
        variants:
          - "According to the report, is there any abnormality of the gallbladder?"
        definition: "An abnormality of the gallbladder is defined as any abnormal finding in the gallbladder. This definition includes operative change, a surgically absent gallbladder and a normal anatomical variant. This definition excludes the bile ducts, and a device where nothing else is abnormal."
        include_terms:
          - "gallstones or cholelithiasis"
          - "gallbladder wall thickening"
          - "cholecystitis of any kind"
          - "a gallbladder polyp or mass"
          - "a surgically absent gallbladder, or a prior cholecystectomy"
  Kidney:
    description: "Kidney and urinary tract findings"
    questions:
      - id: hydronephrosis
        question: "Is there hydronephrosis?"
        variants:
          - "According to the report, is there hydronephrosis?"
        definition: "Hydronephrosis is defined as dilation of the renal collecting system, the pelvis, the calyces, or both. This definition includes hydroureteronephrosis. This definition excludes a dilated ureter beside a normal pelvis and normal calyces."
        include_terms:
          - "hydronephrosis"
          - "hydroureteronephrosis"
          - "pelvicaliectasis"
          - "caliectasis"
        exclude_terms:
          - "hydroureter"
          - "ureterectasis"
          - "ureteral dilation"
        severity_scale: "mild, moderate or severe, or the SFU grade"
      - id: renal_hypodensities
        question: "Are there any renal hypodensities?"
        variants:
          - "According to the report, are there any renal hypodensities?"
        definition: "A renal hypodensity is defined as a hypoattenuating lesion in the kidney, of any cause. This definition includes a simple cyst, a complex cyst and a hypodensity left uncharacterized. This definition excludes a mass that is solid and enhancing throughout, with no cystic or low-attenuation component."
      - id: simple_renal_cysts
        question: "Are there any simple renal cysts?"
        variants:
          - "According to the report, are there any simple renal cysts?"
        definition: "A simple renal cyst is defined as a renal cyst with no internal complexity. This definition includes a renal cyst with no further description. This definition excludes a cyst that is complex, septated, calcified, thick-walled, enhancing or solid, and a hypodensity left uncharacterized."
      - id: complex_renal_cyst
        question: "Are there any complex renal cysts?"
        variants:
          - "According to the report, are there any complex renal cysts?"
        definition: "A complex renal cyst is defined as a renal cyst with internal complexity beyond Bosniak II: four or more septa, a septum or wall thicker than 2 mm, an irregular or enhancing wall, thick or nodular calcification, or an enhancing solid component. This definition includes Bosniak IIF, III and IV. This definition excludes a Bosniak II, which is one to three thin smooth septa, or thin calcification alone."
        include_terms:
          - "complex cyst"
          - "septated cyst"
          - "Bosniak IIF"
          - "Bosniak III"
          - "Bosniak IV"
          - "multiloculated cyst"
        exclude_terms:
          - "simple cyst"
          - "simple renal cyst"
        severity_scale: "the Bosniak category"
      - id: renal_abscess
        question: "Are there any renal abscesses?"
        variants:
          - "According to the report, are there any renal abscesses?"
        definition: "A renal abscess is defined as a rim-enhancing fluid collection in the renal parenchyma or the perinephric space. This definition excludes pyelonephritis with no collection."
      - id: xgp
        question: "Is there xanthogranulomatous pyelonephritis?"
        variants:
          - "According to the report, is there xanthogranulomatous pyelonephritis?"
        definition: "Xanthogranulomatous pyelonephritis is defined as chronic destructive infection of the kidney, with inflammatory masses replacing the parenchyma and dilated multiloculated calyces, the bear-paw appearance, usually with a staghorn or obstructing calculus. This definition includes a focal form with no calculus."
      - id: renal_stones_nephrolithiasis
        question: "Are there any renal stones or nephrolithiasis?"
        variants:
          - "According to the report, are there any renal stones or nephrolithiasis?"
        definition: "A renal stone is defined as a calculus in the kidney, including the renal pelvis, obstructing or not. This definition excludes a stone in a ureter or in the bladder."
        include_terms:
          - "nephrolithiasis"
          - "renal calculus"
