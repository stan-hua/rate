        question: "Is there pseudomyxoma peritonei?"
        variants:
          - "According to the report, is there pseudomyxoma peritonei?"
        definition: "Pseudomyxoma peritonei is defined as gelatinous mucinous material filling the peritoneal cavity and scalloping the organ surfaces. This definition excludes ascites."
      - id: peritoneal_carcinomatosis
        question: "Is there peritoneal carcinomatosis?"
        variants:
          - "According to the report, is there peritoneal carcinomatosis?"
        definition: "Peritoneal carcinomatosis is defined as tumor deposits studding the peritoneum as nodules or plaques. This definition excludes an infiltrated omentum."
