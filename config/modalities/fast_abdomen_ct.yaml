        definition: "Ascites is defined as non-hemorrhagic free peritoneal fluid, as in cirrhosis, malignancy or heart failure. This definition excludes free blood. It excludes fluid placed by location alone, such as trace free fluid in a dependent space. It excludes a section headed \"Ascites\" that then describes blood or fluid of unclear etiology."
