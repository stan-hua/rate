      - id: hemoperitoneum
        question: "Is there hemoperitoneum or free intraperitoneal blood?"
        variants:
          - "According to the report, is there hemoperitoneum or free intraperitoneal blood?"
        definition: "Hemoperitoneum is defined as blood in the peritoneal cavity, shown by high-attenuation free fluid or by free fluid attributed to an injury. This definition excludes fluid left uncharacterized."
        include_terms:
          - "hemoperitoneum"
          - "intraperitoneal blood"
          - "hemorrhagic free fluid"
