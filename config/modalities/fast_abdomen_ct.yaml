          - "a surgically absent uterus or ovary"
  Musculoskeletal:
    description: "Musculoskeletal findings"
    questions:
      - id: fractures_general
        question: "Are there any fractures?"
        variants:
          - "Does the report describe any fracture?"
        definition: "Any bone in the imaged volume is fractured. A rib fracture also answers its own question, and the chronicity field records whether the fracture is acute or healed."
      - id: rib_fractures
        question: "Are there any rib fractures?"
        variants:
          - "Does the report describe rib fractures?"
        definition: "One or more ribs are fractured. The chronicity field records whether the fracture is acute or healed."
      

      - id: any_musculoskeletal
        question: "Is there any abnormality of the bones or body wall?"
        variants:
          - "Does the report describe any abnormality of the bones or body wall?"
        definition: "Anything the report records as abnormal in a bone or the body wall, including a finding the specific questions do not cover. Operative change counts, and so does an organ surgically absent. A device alone does not count where the organ is otherwise normal. A normal anatomical variant counts where the report records it. Degenerative and spondylotic change counts."
        include_terms:
          - "a fracture of any bone in the imaged volume"
          - "a bone lesion, metastasis or sclerosis"
          - "degenerative or spondylotic change"
          - "a body wall or ventral hernia"
