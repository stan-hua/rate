        question: "Is there any free air or pneumoperitoneum?"
        variants:
          - "According to the report, is there any free air or pneumoperitoneum?"
        definition: "Free air is defined as gas outside the bowel lumen in the peritoneal cavity. This definition includes gas confined to the mesentery."
        include_terms:
          - "pneumoperitoneum"
          - "free air"
          - "free intraperitoneal air"
          - "mesenteric free air"
