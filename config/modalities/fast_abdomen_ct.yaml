        definition: "Anything the report records as abnormal in the aorta or its branches, including a finding the specific questions do not cover. Operative change counts, and so does an organ surgically absent. A device alone does not count where the organ is otherwise normal. A normal anatomical variant counts where the report records it."
        include_terms:
          - "aortic aneurysm or dilation"
          - "aortic atherosclerosis or calcification"
          - "aortic dissection"
