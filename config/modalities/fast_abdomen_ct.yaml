        question: "Are there any renal subcapsular hemorrhages?"
        variants:
          - "According to the report, are there any renal subcapsular hemorrhages?"
        definition: "Renal subcapsular hemorrhage is defined as blood between the renal capsule and the parenchyma, flattening it. This definition excludes perinephric blood outside the capsule, and it excludes a parenchymal tear."
      - id: renal_laceration
        question: "Are there any renal lacerations?"
        variants:
          - "According to the report, are there any renal lacerations?"
        definition: "A renal laceration is defined as torn renal parenchyma: a laceration, a fracture, or a shattered kidney. This definition excludes a subcapsular or perinephric hematoma with no parenchymal tear."

      - id: any_kidneys
        question: "Is there any abnormality of the kidneys?"
        variants:
          - "According to the report, is there any abnormality of the kidneys?"
        definition: "An abnormality of a kidney is defined as anything the report records as abnormal there, including a finding the specific questions do not cover. This definition includes operative change, an organ surgically absent, and a normal anatomical variant the report records. This definition excludes a device where the organ is otherwise normal, and it excludes the ureters and the bladder, which are a separate compartment."
