modality: "fast_abdominal_ct"

# Define findings categories and their associated questions
categories:
  Pancreas:
    description: "Pancreas-related findings"
    questions:
      - id: acute_pancreatitis
        question: "Is there acute pancreatitis?"
        variants:
          - "According to the report, is there acute pancreatitis?"
        definition: "Acute pancreatitis is defined as an acutely inflamed pancreas: peripancreatic fat stranding or fluid, glandular enlargement, a non-enhancing segment, or acute pancreatitis the report names. This definition includes an acute episode on a chronic background. It excludes chronic pancreatitis alone, whose signs -- atrophy, parenchymal or ductal calcification, a dilated duct -- the pancreas compartment question covers."
      

      - id: any_pancreas
        question: "Is there any abnormality of the pancreas?"
        variants:
          - "According to the report, is there any abnormality of the pancreas?"
        definition: "An abnormality of the pancreas is defined as anything the report records as abnormal there, including a finding the specific questions do not cover. This definition includes operative change, an organ surgically absent, and a normal anatomical variant the report records. This definition excludes a device where the organ is otherwise normal."
        include_terms:
          - "pancreatitis or peripancreatic inflammation"
          - "a pancreatic mass, cyst or pseudocyst"
          - "pancreatic ductal dilation"
          - "pancreatic atrophy or calcification"
  Spleen:
    description: "Spleen-related findings"
    questions:
      - id: splenomegaly
        question: "Is there splenomegaly?"
        variants:
          - "Is the spleen enlarged?"
          - "According to the report, is there splenomegaly?"
        definition: "Splenomegaly is defined as an enlarged spleen. This definition excludes a measurement the report calls normal."
      - id: epithelial_splenic_cysts
        question: "Are there any epithelial splenic cysts?"
        variants:
          - "According to the report, are there any epithelial splenic cysts?"
        definition: "An epithelial splenic cyst is defined as a true splenic cyst with an epithelial lining, congenital or epidermoid, thin-walled and fluid-density. This definition excludes a cyst the report attributes to trauma, infarction or infection, which the splenic pseudocyst question covers."
      - id: splenic_pseudocyst
        question: "Are there any splenic pseudocysts?"
        variants:
          - "According to the report, are there any splenic pseudocysts?"
        definition: "A splenic pseudocyst is defined as a splenic cyst with no epithelial lining, which the report attributes to prior trauma, infarction or infection. This definition excludes a congenital or epidermoid cyst, which the epithelial splenic cyst question covers."
      - id: splenic_lymphoma
        question: "Is splenic lymphoma present?"
        variants:
          - "Is there lymphomatous involvement of the spleen?"
          - "According to the report, is splenic lymphoma present?"
        definition: "Splenic lymphoma is defined as lymphoma involving the spleen, where the report names splenic lymphoma or describes splenic masses or infiltration in a patient with known lymphoma. This definition excludes splenomegaly alone."
      - id: splenic_laceration
        question: "Are there any splenic lacerations?"
        variants:
          - "According to the report, are there any splenic lacerations?"
        definition: "A splenic laceration is defined as torn splenic parenchyma: a laceration, a fracture, or a shattered spleen. This definition excludes a subcapsular or perisplenic hematoma with no parenchymal tear."
      - id: splenic_infarct
        question: "Are there any splenic infarcts?"
        variants:
          - "According to the report, are there any splenic infarcts?"
        definition: "A splenic infarct is defined as a wedge-shaped or global area of the spleen that does not enhance and that the report calls an infarct."
      - id: spleen_absent
        question: "Is the spleen absent?"
        variants:
          - "According to the report, is the spleen absent?"
        definition: "An absent spleen is defined as no spleen in the splenic fossa, for any reason: a splenectomy, congenital asplenia, or an autosplenectomy. This definition excludes the operative change a splenectomy leaves behind, which the post-splenectomy question covers."
        include_terms:
          - "splenectomy"
          - "surgically absent spleen"
          - "asplenia"
          - "absent spleen"
        exclude_terms:
          - "splenosis"
          - "splenectomy clips"
      - id: accessory_spleen
        question: "Are there any accessory spleens?"
        variants:
          - "Is there a splenule?"
          - "According to the report, are there any accessory spleens?"
        definition: "An accessory spleen is defined as a splenule, a small round nodule of splenic tissue near the splenic hilum or in the splenic ligaments. This definition excludes splenosis after a splenectomy, which the post-splenectomy question covers."

      - id: post_splenectomy_changes
        question: "Are there any post-splenectomy changes in the splenic bed?"
        variants:
          - "According to the report, are there any post-splenectomy changes in the splenic bed?"
        definition: "Post-splenectomy change is defined as operative change from a splenectomy that the report describes: clips or sutures in the splenic bed, a surgical bed or cavity, or splenosis. This definition excludes an absent spleen with no operative change described, which the spleen-absent question covers."
        include_terms:
          - "post-splenectomy change"
          - "splenectomy clips"
          - "splenic bed"
          - "splenosis"
          - "surgical bed in the left upper quadrant"
        exclude_terms:
          - "asplenia"
          - "congenitally absent spleen"
      - id: any_spleen
        question: "Is there any abnormality of the spleen?"
        variants:
          - "According to the report, is there any abnormality of the spleen?"
        definition: "An abnormality of the spleen is defined as anything the report records as abnormal there, including a finding the specific questions do not cover. This definition includes operative change, an organ surgically absent, and a normal anatomical variant the report records. This definition excludes a device where the organ is otherwise normal."
        include_terms:
          - "splenomegaly"
          - "a splenic lesion, cyst or mass"
          - "a splenic infarct"
          - "splenic injury, laceration or hematoma"
          - "a surgically absent spleen, or a prior splenectomy"
  Biliary Tree:
    description: "Biliary tree-related findings"
    questions:
      - id: intrahepatic_duct_dilation
        question: "Is there any intrahepatic biliary ductal dilation?"
        variants:
          - "According to the report, is there any intrahepatic biliary ductal dilation?"
        definition: "Intrahepatic biliary ductal dilation is defined as intrahepatic bile ducts that are dilated, prominent or obstructed. This definition excludes a dilated extrahepatic duct beside normal intrahepatic ducts."
      - id: extrahepatic_duct_dilation
        question: "is there any extrahepatic biliary ductal dilation?"
        variants:
          - "According to the report, is there any extrahepatic biliary ductal dilation?"
        definition: "Extrahepatic biliary ductal dilation is defined as dilation of the extrahepatic bile ducts, the common hepatic duct, the common bile duct, or both. This definition includes a dilated duct after a cholecystectomy. It excludes a dilated intrahepatic duct beside a normal common duct."

      - id: any_biliary
        question: "Is there any abnormality of the bile ducts?"
        variants:
          - "According to the report, is there any abnormality of the bile ducts?"
        definition: "An abnormality of the bile ducts is defined as anything the report records as abnormal there, including a finding the specific questions do not cover. This definition includes operative change, an organ surgically absent, and a normal anatomical variant the report records. This definition excludes a device where the organ is otherwise normal, and it excludes the gallbladder, which is a separate compartment."
        include_terms:
          - "intrahepatic or extrahepatic ductal dilation"
          - "a duct stone or choledocholithiasis"
          - "pneumobilia"
          - "a biliary stricture"
        exclude_terms:
          - "a catheter, stent, drain, graft or other device, where the organ is otherwise normal"
  Liver:
    description: "Liver-related findings"
    questions:
      - id: hepatomegaly
        question: "Is there hepatomegaly?"
        variants:
          - "Is the liver enlarged?"
          - "According to the report, is there hepatomegaly?"
        definition: "Hepatomegaly is defined as an enlarged liver. This definition excludes a measurement the report calls normal."
      - id: hepatic_steatosis
        question: "Is there hepatic steatosis, fatty liver or focal fatty infiltration?"
        variants:
          - "Is the liver fatty or steatotic?"
          - "According to the report, is there hepatic steatosis, fatty liver or focal fatty infiltration?"
        definition: "Hepatic steatosis is defined as fat infiltrating the liver, diffusely or focally."
        include_terms:
          - "hepatic steatosis"
          - "fatty liver"
          - "fatty infiltration"
          - "hepatic fat"
        severity_scale: "the magnitude word the report uses, such as mild, moderate or marked"
      - id: cirrhosis
        question: "Is there cirrhosis?"
        variants:
          - "According to the report, is there cirrhosis?"
        definition: "Cirrhosis is defined as a cirrhotic liver: a nodular contour, a shrunken right lobe with hypertrophy of the caudate or left lobe, or cirrhosis the report names. This definition excludes hepatic steatosis alone and chronic liver disease the report stops short of calling cirrhosis."
      - id: cirrhosis_portal_hypertension
        question: "Is there portal hypertension?"
        variants:
          - "According to the report, is there portal hypertension?"
        definition: "Portal hypertension is defined as portal hypertension the report states, or a portosystemic collateral or a recanalised paraumbilical vein it names. This definition excludes splenomegaly alone and varices alone, which the splenomegaly and varices questions cover."
        include_terms:
          - "portal hypertension"
          - "portosystemic collaterals"
          - "varices"
      - id: gastroesophageal_varices
        question: "Are there any esophageal or gastric varices?"
        variants:
          - "According to the report, are there any esophageal or gastric varices?"
        definition: "Gastroesophageal varices are defined as dilated collateral veins at the oesophagus or the gastric fundus. This definition excludes portosystemic collaterals elsewhere, which the portal hypertension question covers."
      - id: polycystic_liver_disease
        question: "Is polycystic liver disease present?"
        variants:
          - "According to the report, is polycystic liver disease present?"
        definition: "Polycystic liver disease is defined as polycystic liver disease the report states, or innumerable hepatic cysts replacing the parenchyma. This definition excludes a few cysts."
      - id: hepatic_abscess
        question: "Are there any hepatic abscesses?"
        variants:
          - "Are there any liver abscesses?"
          - "According to the report, are there any hepatic abscesses?"
        definition: "A hepatic abscess is defined as a rim-enhancing or multiloculated collection in the liver that the report calls an abscess or an infection. This definition excludes a simple cyst."
      - id: hepatic_cysts_simple
        question: "Are there any hepatic cysts?"
        variants:
          - "Are there any liver cysts?"
          - "According to the report, are there any hepatic cysts?"
        definition: "A simple hepatic cyst is defined as a thin-walled, fluid-density hepatic cyst with no septations, no calcification and no solid component. This definition excludes an abscess, a cystic metastasis, a complex cystic lesion and polycystic liver disease."
      - id: hepatic_hemangioma
        question: "Are there any hepatic hemangiomas?"
        variants:
          - "Is there a liver hemangioma?"
          - "According to the report, are there any hepatic hemangiomas?"
        definition: "A hepatic hemangioma is defined as a hepatic lesion the report calls a hemangioma, by that word or as a lesion with the typical peripheral nodular enhancement."
      - id: hepatic_adenoma
        question: "Are there any hepatic adenomas?"
        variants:
          - "Is there a hepatocellular adenoma?"
          - "According to the report, are there any hepatic adenomas?"
        definition: "A hepatic adenoma is defined as a hepatic lesion the report calls a hepatocellular adenoma. This definition excludes focal nodular hyperplasia, which is a different lesion."
      - id: hepatic_mass_indeterminate
        question: "Are there any indeterminate hepatic masses?"
        variants:
          - "Are there any indeterminate liver masses?"
          - "According to the report, are there any indeterminate hepatic masses?"
        definition: "An indeterminate hepatic mass is defined as a solid hepatic lesion the report describes and does not characterise. This definition excludes a cyst, and it excludes a lesion the report names, such as a hemangioma, a metastasis or a hepatocellular carcinoma."
        include_terms:
          - "indeterminate hepatic lesion"
          - "indeterminate liver mass"
          - "solid hepatic lesion"
        exclude_terms:
          - "hepatic cyst"
          - "simple cyst"
          - "hemangioma"
          - "metastasis"
          - "hepatocellular carcinoma"
      - id: hepatocellular_carcinoma_hcc
        question: "Is there hepatocellular carcinoma?"
        variants:
          - "Is there a hepatoma?"
          - "According to the report, is there hepatocellular carcinoma?"
        definition: "Hepatocellular carcinoma is defined as a hepatic lesion the report calls a hepatocellular carcinoma or a hepatoma. This definition excludes a regenerative or dysplastic nodule and an uncharacterised lesion."
      - id: hepatic_metastases
        question: "Are there any hepatic metastases?"
        variants:
          - "Are there any liver metastases?"
          - "According to the report, are there any hepatic metastases?"
        definition: "A hepatic metastasis is defined as a hepatic lesion the report calls a metastasis or a secondary deposit. This definition excludes an uncharacterised solid lesion, which the indeterminate hepatic mass question covers."
      - id: liver_laceration
        question: "Are there any liver lacerations?"
        variants:
          - "Is there a hepatic laceration?"
          - "According to the report, are there any liver lacerations?"
        definition: "A liver laceration is defined as torn hepatic parenchyma: a laceration, a fracture, or a devascularised segment. This definition excludes a subcapsular or perihepatic hematoma with no parenchymal tear."
      - id: active_extravasation_liver
        question: "Are there any sites of active extravasation in the liver?"
        variants:
          - "Is there active hemorrhage or a contrast blush in the liver?"
          - "According to the report, are there any sites of active extravasation in the liver?"
        definition: "Active extravasation in the liver is defined as contrast leaving a vessel into the hepatic parenchyma or around it: active extravasation, a contrast blush, or a pseudoaneurysm the report calls active. This definition excludes a hematoma with no contrast leak."
      - id: prior_liver_resection
        question: "Is there a prior liver resection?"
        variants:
          - "Is there a prior hepatectomy?"
          - "According to the report, is there a prior liver resection?"
        definition: "A prior liver resection is defined as part of the liver removed at an operation, which the report records as the surgery itself or as the change it left: a resection margin or surgical plane, clips or sutures at the cut surface, a post-surgical cavity or seroma, or hypertrophy of the remnant. This definition includes a segmentectomy, a partial hepatectomy and a lobectomy alike. It excludes a small or atrophic liver with no sign of surgery, and it excludes a transplanted liver."
      - id: post_liver_transplant
        question: "Are there any hepatic changes post-transplantation?"
        variants:
          - "Is there a hepatic allograft?"
          - "According to the report, are there any hepatic changes post-transplantation?"
        definition: "A liver transplant is defined as a transplanted liver, or operative change from one: a vascular or biliary anastomosis, or a prior transplant the report names. This definition excludes a hepatic resection."
      - id: portal_venous_occlusion_thrombosis
        question: "Is there portal venous occlusion?"
        variants:
          - "Is the portal vein thrombosed or occluded?"
          - "According to the report, is there portal venous occlusion?"
        definition: "Portal venous thrombosis is defined as thrombus in the portal vein or its branches, whether or not it occludes the lumen. This definition includes a chronically occluded vein and cavernous transformation."
      - id: portal_venous_gas
        question: "Is there any portal venous gas?"
        variants:
          - "Is there portal venous air?"
          - "According to the report, is there any portal venous gas?"
        definition: "Portal venous gas is defined as gas in the portal vein or its intrahepatic branches, extending to the periphery of the liver. This definition excludes gas in the bile ducts, which stays central and which the pneumobilia question covers."
      
      
      - id: any_liver
        question: "Is there any abnormality of the liver?"
        variants:
          - "According to the report, is there any abnormality of the liver?"
        definition: "An abnormality of the liver is defined as anything the report records as abnormal there, including a finding the specific questions do not cover. This definition includes operative change, an organ surgically absent, and a normal anatomical variant the report records. This definition excludes a device where the organ is otherwise normal, and it excludes the bile ducts and the gallbladder, which are separate compartments."
        include_terms:
          - "hepatic steatosis or a fatty liver"
          - "a hepatic lesion, cyst or mass"
          - "cirrhosis or a nodular hepatic contour"
          - "hepatomegaly"
          - "hepatic injury, laceration or hematoma"
  Gallbladder:
    description: "Gallbladder-related findings"
    questions:
      - id: gallbladder_stones
        question: "Are there any gallbladder stones or cholelithiasis?"
        variants:
          - "Are there any gallstones?"
          - "According to the report, are there any gallbladder stones or cholelithiasis?"
        definition: "A gallstone is defined as a calculus in the gallbladder. This definition excludes sludge alone, and it excludes a stone in the cystic duct or the common bile duct."
      - id: gallbladder_surgically_absent
        question: "Is the gallbladder surgically absent?"
        variants:
          - "Is there a prior cholecystectomy?"
          - "According to the report, is the gallbladder surgically absent?"
        definition: "A surgically absent gallbladder is defined as a gallbladder absent after a cholecystectomy, where the report states the prior surgery or records no gallbladder beside surgical clips in the gallbladder fossa. This definition excludes a contracted or poorly distended gallbladder."
      - id: choledochal_cysts
        question: "Are there any choledochal cysts?"
        variants:
          - "According to the report, are there any choledochal cysts?"
        definition: "A choledochal cyst is defined as a congenital cystic dilation of the bile duct, by any of the Todani types. This definition excludes acquired dilation from obstruction, so a dilated duct beside a stone or a mass does not count."
      - id: acute_cholecystitis
        question: "Is there acute cholecystitis?"
        variants:
          - "According to the report, is there acute cholecystitis?"
        definition: "Acute cholecystitis is defined as an acutely inflamed gallbladder: wall thickening with pericholecystic fluid or fat stranding, mural hyperenhancement, or acute cholecystitis the report names. This definition includes an acute episode on a chronic background. It excludes gallstones alone, and it excludes chronic cholecystitis alone, whose signs -- a contracted, thick-walled gallbladder with stones -- the wall thickening and gallstone questions cover."
      - id: cholecystitis_with_rupture
        question: "Is there acute cholecystitis with rupture?"
        variants:
          - "Is there acute cholecystitis with gallbladder perforation?"
          - "According to the report, is there acute cholecystitis with rupture?"
        definition: "Acute cholecystitis with rupture is defined as acute cholecystitis with a breach of the gallbladder wall: a perforation, a wall defect, or a pericholecystic abscess the report attributes to it. This definition excludes a traumatic rupture with no cholecystitis."
      - id: emphysematous_cholecystitis
        question: "Is there emphysematous cholecystitis?"
        variants:
          - "According to the report, is there emphysematous cholecystitis?"
        definition: "Emphysematous cholecystitis is defined as acute cholecystitis with gas in the gallbladder wall or lumen. This definition excludes gas in the bile ducts alone, which the pneumobilia question covers."
      - id: porcelain_gallbladder
        question: "Is there porcelain gallbladder?"
        variants:
          - "According to the report, is there porcelain gallbladder?"
        definition: "A porcelain gallbladder is defined as a gallbladder wall calcified extensively or completely. This definition excludes a single mural calcification and a calcified stone."
      - id: pneumobilia
        question: "Is there pneumobilia?"
        variants:
          - "Is there aerobilia?"
          - "According to the report, is there pneumobilia?"
        definition: "Pneumobilia is defined as gas in the biliary tree: the intrahepatic ducts, the extrahepatic ducts, or the gallbladder."
        include_terms:
          - "pneumobilia"
          - "biliary gas"
          - "air in the biliary tree"
          - "aerobilia"
      - id: gallbladder_wall_thickening
        question: "Is there diffuse gallbladder wall thickening?"
        variants:
          - "According to the report, is there diffuse gallbladder wall thickening?"
        definition: "Gallbladder wall thickening is defined as diffuse thickening of the gallbladder wall. This definition excludes focal thickening with the features of adenomyomatosis."
        include_terms:
          - "gallbladder wall thickening"
          - "thickened gallbladder wall"
        exclude_terms:
          - "adenomyomatosis"
          - "Rokitansky-Aschoff"
        severity_scale: "the magnitude word the report uses, such as mild, moderate or marked"
      - id: gallbladder_adenomyomatosis
        question: "Is there gallbladder adenomyomatosis?"
        variants:
          - "According to the report, is there gallbladder adenomyomatosis?"
        definition: "Gallbladder adenomyomatosis is defined as a thickened gallbladder wall containing intramural diverticula or Rokitansky-Aschoff sinuses, at the fundus or in the mid-body."
        include_terms:
          - "adenomyomatosis"
          - "adenomyomatous"
          - "Rokitansky-Aschoff"
      - id: gallbladder_cancer
        question: "Is there gallbladder cancer?"
        variants:
          - "Is there gallbladder carcinoma?"
          - "According to the report, is there gallbladder cancer?"
        definition: "Gallbladder cancer is defined as a malignant tumour of the gallbladder, a mass arising from the wall, or gallbladder carcinoma the report names. This definition excludes a polyp with no malignant diagnosis attached."

      - id: any_gallbladder
        question: "Is there any abnormality of the gallbladder?"
        variants:
          - "According to the report, is there any abnormality of the gallbladder?"
        definition: "An abnormality of the gallbladder is defined as anything the report records as abnormal there, including a finding the specific questions do not cover. This definition includes operative change, an organ surgically absent, and a normal anatomical variant the report records. This definition excludes a device where the organ is otherwise normal, and it excludes the bile ducts, which are a separate compartment."
        include_terms:
          - "gallstones or cholelithiasis"
          - "gallbladder wall thickening"
          - "cholecystitis of any kind"
          - "a gallbladder polyp or mass"
          - "a surgically absent gallbladder, or a prior cholecystectomy"
  Kidney:
    description: "Kidney and urinary tract findings"
    questions:
      - id: hydronephrosis
        question: "Is there hydronephrosis?"
        variants:
          - "According to the report, is there hydronephrosis?"
        definition: "Hydronephrosis is defined as dilation of the renal collecting system, the pelvis, the calyces, or both. This definition includes hydroureteronephrosis and excludes a dilated ureter beside a normal pelvis and normal calyces."
        include_terms:
          - "hydronephrosis"
          - "hydroureteronephrosis"
          - "pelvicaliectasis"
          - "caliectasis"
        exclude_terms:
          - "hydroureter"
          - "ureterectasis"
          - "ureteral dilation"
        severity_scale: "the grade the report gives, such as mild, moderate or severe"
      - id: renal_hypodensities
        question: "Are there any renal hypodensities?"
        variants:
          - "According to the report, are there any renal hypodensities?"
        definition: "A renal hypodensity is defined as a low-density lesion in the kidney, whatever the report calls it. This definition includes a simple cyst, a complex cyst and an uncharacterised hypodensity, because this is the umbrella question and the specific cyst questions fall under it. It excludes a solid enhancing mass."
      - id: simple_renal_cysts
        question: "Are there any simple renal cysts?"
        variants:
          - "According to the report, are there any simple renal cysts?"
        definition: "A simple renal cyst is defined as a thin-walled, fluid-density renal cyst with no septations, no calcification and no solid component. This definition excludes a cyst with any internal complexity, and it excludes a hypodensity the report leaves uncharacterised, which the renal hypodensity umbrella question covers."
      - id: complex_renal_cyst
        question: "Are there any complex renal cysts?"
        variants:
          - "According to the report, are there any complex renal cysts?"
        definition: "A complex renal cyst is defined as a renal cyst with internal complexity: septations, multiple locules, a thickened or enhancing wall, calcification, or solid elements. Bosniak IIF and above count."
        include_terms:
          - "complex cyst"
          - "septated cyst"
          - "Bosniak"
          - "multiloculated cyst"
        exclude_terms:
          - "simple cyst"
          - "simple renal cyst"
        severity_scale: "the Bosniak category, if the report gives one"
      - id: renal_abscess
        question: "Are there any renal abscesses?"
        variants:
          - "According to the report, are there any renal abscesses?"
        definition: "A renal abscess is defined as a rim-enhancing fluid collection in the renal parenchyma or the perinephric space, which the report calls an abscess. This definition excludes pyelonephritis with no collection."
      - id: xgp
        question: "Is there xanthogranulomatous pyelonephritis?"
        variants:
          - "According to the report, is there xanthogranulomatous pyelonephritis?"
        definition: "Xanthogranulomatous pyelonephritis is defined as a chronically infected and destroyed kidney, with a staghorn calculus and inflammatory masses, which the report names xanthogranulomatous pyelonephritis."
      - id: renal_stones_nephrolithiasis
        question: "Are there any renal stones / nephrolithiasis?"
        variants:
          - "Is there a renal calculus or a kidney stone?"
          - "According to the report, are there any renal stones / nephrolithiasis?"
        definition: "A renal stone is defined as a calculus in the kidney, including the renal pelvis. This definition excludes a stone in a ureter or in the bladder."
        include_terms:
          - "nephrolithiasis"
          - "renal calculus"
          - "renal stone"
          - "kidney stone"
        exclude_terms:
          - "ureteral stone"
          - "ureterolithiasis"
          - "bladder stone"
      - id: nephrocalcinosis
        question: "Is there nephrocalcinosis?"
        variants:
          - "According to the report, is there nephrocalcinosis?"
        definition: "Nephrocalcinosis is defined as calcium deposits in the renal parenchyma, medullary or cortical. This definition excludes a calculus in the collecting system and vascular calcification."
      - id: polycystic_kidney_disease
        question: "Is there polycystic kidney disease?"
        variants:
          - "According to the report, is there polycystic kidney disease?"
        definition: "Polycystic kidney disease is defined as polycystic kidney disease the report states, or innumerable bilateral cysts replacing the renal parenchyma. This definition excludes a few cysts in each kidney."
        include_terms:
          - "polycystic kidney"
          - "ADPKD"
          - "innumerable bilateral renal cysts"
        exclude_terms:
          - "bilateral renal cysts"
          - "multiple renal cysts"
      - id: horseshoe_kidney
        question: "Is there horseshoe kidney?"
        variants:
          - "According to the report, is there horseshoe kidney?"
        definition: "A horseshoe kidney is defined as the lower poles of the two kidneys fused across the midline. This definition excludes a pelvic, an ectopic and a crossed-fused kidney, which are different anomalies."
      - id: renal_cell_carcinoma_rcc
        question: "Are there any renal cell carcinomas?"
        variants:
          - "According to the report, are there any renal cell carcinomas?"
        definition: "Renal cell carcinoma is defined as a renal mass the report calls a renal cell carcinoma, or a renal malignancy it names. This definition excludes an uncharacterised renal mass and a complex cyst."
      - id: renal_lymphoma
        question: "Is there renal lymphoma?"
        variants:
          - "Is there lymphomatous involvement of a kidney?"
          - "According to the report, is there renal lymphoma?"
        definition: "Renal lymphoma is defined as lymphoma involving a kidney, where the report names renal lymphoma or describes renal masses or infiltration in a patient with known lymphoma."
      - id: angiomyolipoma_aml
        question: "Are there any angiomyolipomas?"
        variants:
          - "According to the report, are there any angiomyolipomas?"
        definition: "An angiomyolipoma is defined as a fat-containing lesion, almost always in the kidney and rarely in the liver. This definition excludes an adrenal myelolipoma, which is a different lesion in a different organ."
        include_terms:
          - "angiomyolipoma"
          - "AML"
          - "fat-containing renal lesion"
        exclude_terms:
          - "myelolipoma"
          - "myolipoma"
          - "adrenal myelolipoma"
      - id: post_nephrectomy
        question: "Are there any post-nephrectomy changes?"
        variants:
          - "According to the report, are there any post-nephrectomy changes?"
        definition: "Post-nephrectomy change is defined as operative change from a nephrectomy: a surgical bed or cavity in the renal fossa, clips or sutures, or a parenchymal defect from a partial nephrectomy. This definition includes a partial and a total nephrectomy alike, and a kidney the report states was surgically removed. It excludes an absent kidney alone -- congenital absence, agenesis, or an absence the report does not explain -- and it excludes a renal allograft."
