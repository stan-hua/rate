modality: "fast_abdominal_ct"

# Define findings categories and their associated questions
categories:
  Pancreas:
    description: "Pancreas-related findings"
    questions:
      - id: acute_pancreatitis
        question: "Is there acute pancreatitis?"
        variants:
          - "Does the report describe acute pancreatitis?"
        definition: "The pancreas is acutely inflamed: peripancreatic fat stranding or fluid, glandular enlargement, a non-enhancing segment, or a report naming acute pancreatitis. An acute episode on a chronic background counts. Chronic pancreatitis alone does not count, and its signs -- atrophy, parenchymal or ductal calcification, a dilated duct -- answer the pancreas compartment question."
      

      - id: any_pancreas
        question: "Is there any abnormality of the pancreas?"
        variants:
          - "Does the report describe any abnormality of the pancreas?"
        definition: "Anything the report records as abnormal in the pancreas, including a finding the specific questions do not cover. Operative change counts, and so does an organ surgically absent. A device alone does not count where the organ is otherwise normal. A normal anatomical variant counts where the report records it."
        include_terms:
          - "pancreatitis or peripancreatic inflammation"
          - "a pancreatic mass, cyst or pseudocyst"
          - "pancreatic ductal dilation"
          - "pancreatic atrophy or calcification"
  Spleen:
    description: "Spleen-related findings"
    questions:
      - id: splenomegaly
        question: "Is there splenomegaly?"
        variants:
          - "Is the spleen enlarged?"
          - "Does the report describe splenomegaly?"
        definition: "The spleen is enlarged. A measurement the report calls normal does not count."
      - id: epithelial_splenic_cysts
        question: "Are there any epithelial splenic cysts?"
        variants:
          - "Does the report describe any epithelial splenic cysts?"
        definition: "A true splenic cyst with an epithelial lining: congenital or epidermoid, thin-walled and fluid-density. A cyst the report attributes to trauma, infarction or infection has its own question."
      - id: splenic_pseudocyst
        question: "Are there any splenic pseudocysts?"
        variants:
          - "Does the report describe splenic pseudocysts?"
        definition: "A splenic cyst with no epithelial lining, which the report attributes to prior trauma, infarction or infection. A congenital or epidermoid cyst has its own question."
      - id: splenic_lymphoma
        question: "Is splenic lymphoma present?"
        variants:
          - "Is there lymphomatous involvement of the spleen?"
          - "Does the report describe splenic lymphoma?"
        definition: "Lymphoma involves the spleen: the report names splenic lymphoma, or describes splenic masses or infiltration in a patient with known lymphoma. Splenomegaly alone does not count."
      - id: splenic_laceration
        question: "Are there any splenic lacerations?"
        variants:
          - "Does the report describe splenic lacerations?"
        definition: "The splenic parenchyma is torn: a laceration, a fracture, or a shattered spleen. A subcapsular or perisplenic hematoma with no parenchymal tear does not count."
      - id: splenic_infarct
        question: "Are there any splenic infarcts?"
        variants:
          - "Does the report describe splenic infarcts?"
        definition: "A wedge-shaped or global area of the spleen does not enhance, and the report calls it an infarct."
      - id: spleen_absent
        question: "Is the spleen absent?"
        variants:
          - "Does the report describe an absent spleen?"
        definition: "The spleen is not in the splenic fossa, for any reason: a splenectomy, congenital asplenia, or an autosplenectomy. The operative change a splenectomy leaves behind has its own question from this round."
        include_terms:
          - "splenectomy"
          - "surgically absent spleen"
          - "asplenia"
          - "absent spleen"
        exclude_terms:
          - "splenosis"
          - "splenectomy clips"
      - id: accessory_spleen
        question: "Are there any accessory spleens?"
        variants:
          - "Is there a splenule?"
          - "Does the report describe an accessory spleen?"
        definition: "A splenule: a small round nodule of splenic tissue near the splenic hilum or in the splenic ligaments. Splenosis after a splenectomy has its own question."

      - id: post_splenectomy_changes
        question: "Are there any post-splenectomy changes in the splenic bed?"
        variants:
          - "Does the report describe post-splenectomy changes in the splenic bed?"
        definition: "The report describes operative change from a splenectomy: clips or sutures in the splenic bed, a surgical bed or cavity, or splenosis. An absent spleen with no operative change described answers the spleen-absent question instead."
        include_terms:
          - "post-splenectomy change"
          - "splenectomy clips"
          - "splenic bed"
          - "splenosis"
          - "surgical bed in the left upper quadrant"
        exclude_terms:
          - "asplenia"
          - "congenitally absent spleen"
      - id: any_spleen
        question: "Is there any abnormality of the spleen?"
        variants:
          - "Does the report describe any abnormality of the spleen?"
        definition: "Anything the report records as abnormal in the spleen, including a finding the specific questions do not cover. Operative change counts, and so does an organ surgically absent. A device alone does not count where the organ is otherwise normal. A normal anatomical variant counts where the report records it."
        include_terms:
          - "splenomegaly"
          - "a splenic lesion, cyst or mass"
          - "a splenic infarct"
          - "splenic injury, laceration or hematoma"
          - "a surgically absent spleen, or a prior splenectomy"
  Biliary Tree:
    description: "Biliary tree-related findings"
    questions:
      - id: intrahepatic_duct_dilation
        question: "Is there any intrahepatic biliary ductal dilation?"
        variants:
          - "Does the report describe intrahepatic biliary ductal dilation?"
        definition: "The intrahepatic bile ducts are dilated, prominent or obstructed. A dilated extrahepatic duct beside normal intrahepatic ducts has its own question."
      - id: extrahepatic_duct_dilation
        question: "is there any extrahepatic biliary ductal dilation?"
        variants:
          - "Does the report describe extrahepatic biliary ductal dilation?"
        definition: "The extrahepatic bile ducts are dilated -- the common hepatic duct, the common bile duct, or both. A dilated duct after a cholecystectomy counts. A dilated intrahepatic duct beside a normal common duct has its own question."

      - id: any_biliary
        question: "Is there any abnormality of the bile ducts?"
        variants:
          - "Does the report describe any abnormality of the bile ducts?"
        definition: "Anything the report records as abnormal in the bile ducts, including a finding the specific questions do not cover. Operative change counts, and so does an organ surgically absent. A device alone does not count where the organ is otherwise normal. A normal anatomical variant counts where the report records it. The gallbladder is a separate compartment."
        include_terms:
          - "intrahepatic or extrahepatic ductal dilation"
          - "a duct stone or choledocholithiasis"
          - "pneumobilia"
          - "a biliary stricture"
        exclude_terms:
          - "a catheter, stent, drain, graft or other device, where the organ is otherwise normal"
  Liver:
    description: "Liver-related findings"
    questions:
      - id: hepatomegaly
        question: "Is there hepatomegaly?"
        variants:
          - "Is the liver enlarged?"
          - "Does the report describe hepatomegaly?"
        definition: "The liver is enlarged. A measurement the report calls normal does not count."
      - id: hepatic_steatosis
        question: "Is there hepatic steatosis, fatty liver or focal fatty infiltration?"
        variants:
          - "Is the liver fatty or steatotic?"
          - "Does the report describe hepatic steatosis, fatty liver or focal fatty infiltration?"
        definition: "Fat infiltrates the liver, diffusely or focally."
        include_terms:
          - "hepatic steatosis"
          - "fatty liver"
          - "fatty infiltration"
          - "hepatic fat"
        severity_scale: "the magnitude word the report uses, such as mild, moderate or marked"
      - id: cirrhosis
        question: "Is there cirrhosis?"
        variants:
          - "Does the report describe cirrhosis?"
        definition: "The liver is cirrhotic: a nodular contour, a shrunken right lobe with hypertrophy of the caudate or left lobe, or a report naming cirrhosis. Hepatic steatosis alone does not count, and neither does chronic liver disease the report stops short of calling cirrhosis."
      - id: cirrhosis_portal_hypertension
        question: "Is there portal hypertension?"
        variants:
          - "Does the report describe portal hypertension?"
        definition: "The report states portal hypertension, or names a portosystemic collateral or a recanalised paraumbilical vein. Splenomegaly alone does not count, and neither do varices alone; both have their own questions."
        include_terms:
          - "portal hypertension"
          - "portosystemic collaterals"
          - "varices"
      - id: gastroesophageal_varices
        question: "Are there any esophageal or gastric varices?"
        variants:
          - "Does the report describe esophageal or gastric varices?"
        definition: "Dilated collateral veins at the oesophagus or the gastric fundus. Portosystemic collaterals elsewhere answer the portal hypertension question."
      - id: polycystic_liver_disease
        question: "Is polycystic liver disease present?"
        variants:
          - "Does the report describe polycystic liver disease?"
        definition: "The report states polycystic liver disease, or describes innumerable hepatic cysts replacing the parenchyma. A few cysts do not count."
      - id: hepatic_abscess
        question: "Are there any hepatic abscesses?"
        variants:
          - "Are there any liver abscesses?"
          - "Does the report describe hepatic abscesses?"
        definition: "A rim-enhancing or multiloculated collection in the liver that the report calls an abscess or an infection. A simple cyst does not count."
      - id: hepatic_cysts_simple
        question: "Are there any hepatic cysts?"
        variants:
          - "Are there any liver cysts?"
          - "Does the report describe hepatic cysts?"
        definition: "A thin-walled, fluid-density hepatic cyst with no septations, no calcification and no solid component. An abscess, a cystic metastasis and a complex cystic lesion do not count, and polycystic liver disease has its own question."
      - id: hepatic_hemangioma
        question: "Are there any hepatic hemangiomas?"
        variants:
          - "Is there a liver hemangioma?"
          - "Does the report describe hepatic hemangiomas?"
        definition: "A hepatic lesion the report calls a hemangioma, by that word or as a lesion with the typical peripheral nodular enhancement."
      - id: hepatic_adenoma
        question: "Are there any hepatic adenomas?"
        variants:
          - "Is there a hepatocellular adenoma?"
          - "Does the report describe hepatic adenomas?"
        definition: "A hepatic lesion the report calls a hepatocellular adenoma. Focal nodular hyperplasia is a different lesion."
      - id: hepatic_mass_indeterminate
        question: "Are there any indeterminate hepatic masses?"
        variants:
          - "Are there any indeterminate liver masses?"
          - "Does the report describe any indeterminate hepatic masses?"
        definition: "The report describes a solid hepatic lesion and does not characterise it. A cyst does not count. A lesion the report names has its own question: hemangioma, metastasis, hepatocellular carcinoma."
        include_terms:
          - "indeterminate hepatic lesion"
          - "indeterminate liver mass"
          - "solid hepatic lesion"
        exclude_terms:
          - "hepatic cyst"
          - "simple cyst"
          - "hemangioma"
          - "metastasis"
          - "hepatocellular carcinoma"
      - id: hepatocellular_carcinoma_hcc
        question: "Is there hepatocellular carcinoma?"
        variants:
          - "Is there a hepatoma?"
          - "Does the report describe hepatocellular carcinoma?"
        definition: "A hepatic lesion the report calls a hepatocellular carcinoma or a hepatoma. A regenerative or dysplastic nodule does not count, and an uncharacterised lesion has its own question."
      - id: hepatic_metastases
        question: "Are there any hepatic metastases?"
        variants:
          - "Are there any liver metastases?"
          - "Does the report describe hepatic metastases?"
        definition: "A hepatic lesion the report calls a metastasis or a secondary deposit. An uncharacterised solid lesion has its own question."
      - id: liver_laceration
        question: "Are there any liver lacerations?"
        variants:
          - "Is there a hepatic laceration?"
          - "Does the report describe liver lacerations?"
        definition: "The hepatic parenchyma is torn: a laceration, a fracture, or a devascularised segment. A subcapsular or perihepatic hematoma with no parenchymal tear does not count."
      - id: active_extravasation_liver
        question: "Are there any sites of active extravasation in the liver?"
        variants:
          - "Is there active hemorrhage or a contrast blush in the liver?"
          - "Does the report describe sites of active extravasation in the liver?"
        definition: "Contrast leaves a vessel into the hepatic parenchyma or around it: active extravasation, a contrast blush, or a pseudoaneurysm the report calls active. A hematoma with no contrast leak does not count."
      - id: prior_liver_resection
        question: "Is there a prior liver resection?"
        variants:
          - "Is there a prior hepatectomy?"
          - "Does the report describe a prior liver resection?"
        definition: "Part of the liver was removed at an operation, which the report records as the surgery itself or as the change it left: a resection margin or surgical plane, clips or sutures at the cut surface, a post-surgical cavity or seroma, or hypertrophy of the remnant. A segmentectomy, a partial hepatectomy and a lobectomy all count. A small or atrophic liver with no sign of surgery does not count, and a transplanted liver has its own question."
      - id: post_liver_transplant
        question: "Are there any hepatic changes post-transplantation?"
        variants:
          - "Is there a hepatic allograft?"
          - "Does the report describe hepatic changes post-transplantation?"
        definition: "A transplanted liver, or operative change from one: a vascular or biliary anastomosis, or a report naming a prior transplant. A hepatic resection has its own question."
      - id: portal_venous_occlusion_thrombosis
        question: "Is there portal venous occlusion?"
        variants:
          - "Is the portal vein thrombosed or occluded?"
          - "Does the report describe portal venous occlusion?"
        definition: "Thrombus in the portal vein or its branches, whether or not it occludes the lumen. A chronically occluded vein counts, and so does cavernous transformation."
      - id: portal_venous_gas
        question: "Is there any portal venous gas?"
        variants:
          - "Is there portal venous air?"
          - "Does the report describe portal venous gas?"
        definition: "Gas in the portal vein or its intrahepatic branches, which extends to the periphery of the liver. Gas in the bile ducts answers the pneumobilia question, and that gas stays central."
      
      
      - id: any_liver
        question: "Is there any abnormality of the liver?"
        variants:
          - "Does the report describe any abnormality of the liver?"
        definition: "Anything the report records as abnormal in the liver, including a finding the specific questions do not cover. Operative change counts, and so does an organ surgically absent. A device alone does not count where the organ is otherwise normal. A normal anatomical variant counts where the report records it. The bile ducts and the gallbladder are separate compartments."
        include_terms:
          - "hepatic steatosis or a fatty liver"
          - "a hepatic lesion, cyst or mass"
          - "cirrhosis or a nodular hepatic contour"
          - "hepatomegaly"
          - "hepatic injury, laceration or hematoma"
  Gallbladder:
    description: "Gallbladder-related findings"
    questions:
      - id: gallbladder_stones
        question: "Are there any gallbladder stones or cholelithiasis?"
        variants:
          - "Are there any gallstones?"
          - "Does the report describe gallbladder stones or cholelithiasis?"
        definition: "A calculus in the gallbladder. Sludge alone does not count, and a stone in the cystic duct or the common bile duct has its own question."
      - id: gallbladder_surgically_absent
        question: "Is the gallbladder surgically absent?"
        variants:
          - "Is there a prior cholecystectomy?"
          - "Does the report describe a surgically absent gallbladder?"
        definition: "The gallbladder is absent after a cholecystectomy: the report states the prior surgery, or records no gallbladder beside surgical clips in the gallbladder fossa. A contracted or poorly distended gallbladder does not count."
      - id: choledochal_cysts
        question: "Are there any choledochal cysts?"
        variants:
          - "Does the report describe a choledochal cyst?"
        definition: "A congenital cystic dilation of the bile duct, by any of the Todani types. Acquired dilation from obstruction has its own question, so a dilated duct beside a stone or a mass does not count."
      - id: acute_cholecystitis
        question: "Is there acute cholecystitis?"
        variants:
          - "Does the report describe acute cholecystitis?"
        definition: "The gallbladder is acutely inflamed: wall thickening with pericholecystic fluid or fat stranding, mural hyperenhancement, or a report naming acute cholecystitis. An acute episode on a chronic background counts. Gallstones alone do not count. Chronic cholecystitis alone does not count, and its signs -- a contracted, thick-walled gallbladder with stones -- answer the wall thickening and gallstone questions."
      - id: cholecystitis_with_rupture
        question: "Is there acute cholecystitis with rupture?"
        variants:
          - "Is there acute cholecystitis with gallbladder perforation?"
          - "Does the report describe acute cholecystitis with rupture?"
        definition: "Acute cholecystitis with a breach of the gallbladder wall: a perforation, a wall defect, or a pericholecystic abscess the report attributes to it. A traumatic rupture with no cholecystitis does not count."
      - id: emphysematous_cholecystitis
        question: "Is there emphysematous cholecystitis?"
        variants:
          - "Does the report describe emphysematous cholecystitis?"
        definition: "Acute cholecystitis with gas in the gallbladder wall or lumen. Gas in the bile ducts alone answers the pneumobilia question."
      - id: porcelain_gallbladder
        question: "Is there porcelain gallbladder?"
        variants:
          - "Does the report describe porcelain gallbladder?"
        definition: "The gallbladder wall is calcified, extensively or completely. A single mural calcification does not count, and neither does a calcified stone."
      - id: pneumobilia
        question: "Is there pneumobilia?"
        variants:
          - "Is there aerobilia?"
          - "Does the report describe pneumobilia?"
        definition: "Gas lies in the biliary tree: the intrahepatic ducts, the extrahepatic ducts, or the gallbladder."
        include_terms:
          - "pneumobilia"
          - "biliary gas"
          - "air in the biliary tree"
          - "aerobilia"
      - id: gallbladder_wall_thickening
        question: "Is there diffuse gallbladder wall thickening?"
        variants:
          - "Does the report describe diffuse gallbladder wall thickening?"
        definition: "The gallbladder wall is diffusely thickened. Focal thickening with the features of adenomyomatosis has its own question."
        include_terms:
          - "gallbladder wall thickening"
          - "thickened gallbladder wall"
        exclude_terms:
          - "adenomyomatosis"
          - "Rokitansky-Aschoff"
        severity_scale: "the magnitude word the report uses, such as mild, moderate or marked"
      - id: gallbladder_adenomyomatosis
        question: "Is there gallbladder adenomyomatosis?"
        variants:
          - "Does the report describe gallbladder adenomyomatosis?"
        definition: "The gallbladder wall is thickened and contains intramural diverticula or Rokitansky-Aschoff sinuses, at the fundus or in the mid-body."
        include_terms:
          - "adenomyomatosis"
          - "adenomyomatous"
          - "Rokitansky-Aschoff"
      - id: gallbladder_cancer
        question: "Is there gallbladder cancer?"
        variants:
          - "Is there gallbladder carcinoma?"
          - "Does the report describe gallbladder cancer?"
        definition: "A malignant tumour of the gallbladder: a mass arising from the wall, or a report naming gallbladder carcinoma. A polyp with no malignant diagnosis attached does not count."

      - id: any_gallbladder
        question: "Is there any abnormality of the gallbladder?"
        variants:
          - "Does the report describe any abnormality of the gallbladder?"
        definition: "Anything the report records as abnormal in the gallbladder, including a finding the specific questions do not cover. Operative change counts, and so does an organ surgically absent. A device alone does not count where the organ is otherwise normal. A normal anatomical variant counts where the report records it. The bile ducts are a separate compartment."
        include_terms:
          - "gallstones or cholelithiasis"
          - "gallbladder wall thickening"
          - "cholecystitis of any kind"
          - "a gallbladder polyp or mass"
          - "a surgically absent gallbladder, or a prior cholecystectomy"
  Kidney:
    description: "Kidney and urinary tract findings"
    questions:
      - id: hydronephrosis
        question: "Is there hydronephrosis?"
        variants:
          - "Does the report describe hydronephrosis?"
        definition: "The renal collecting system is dilated: the pelvis, the calyces, or both. A dilated ureter beside a normal pelvis and normal calyces does not count, and hydroureteronephrosis does."
        include_terms:
          - "hydronephrosis"
          - "hydroureteronephrosis"
          - "pelvicaliectasis"
          - "caliectasis"
        exclude_terms:
          - "hydroureter"
          - "ureterectasis"
          - "ureteral dilation"
        severity_scale: "the grade the report gives, such as mild, moderate or severe"
      - id: renal_hypodensities
        question: "Are there any renal hypodensities?"
        variants:
          - "Does the report describe renal hypodensities?"
        definition: "A low-density lesion in the kidney, whatever the report calls it: a simple cyst, a complex cyst and an uncharacterised hypodensity all count. This is the umbrella question, and the specific cyst questions fall under it. A solid enhancing mass does not count."
      - id: simple_renal_cysts
        question: "Are there any simple renal cysts?"
        variants:
          - "Does the report describe simple renal cysts?"
        definition: "A thin-walled, fluid-density renal cyst with no septations, no calcification and no solid component. A cyst with any internal complexity has its own question."
      - id: complex_renal_cyst
        question: "Are there any complex renal cysts?"
        variants:
          - "Does the report describe a complex renal cyst?"
        definition: "A renal cyst shows internal complexity: septations, multiple locules, a thickened or enhancing wall, calcification, or solid elements. Bosniak IIF and above."
        include_terms:
          - "complex cyst"
          - "septated cyst"
          - "Bosniak"
          - "multiloculated cyst"
        exclude_terms:
          - "simple cyst"
          - "simple renal cyst"
        severity_scale: "the Bosniak category, if the report gives one"
      - id: renal_abscess
        question: "Are there any renal abscesses?"
        variants:
          - "Does the report describe renal abscesses?"
        definition: "A rim-enhancing fluid collection in the renal parenchyma or the perinephric space, which the report calls an abscess. Pyelonephritis with no collection does not count."
      - id: xgp
        question: "Is there xanthogranulomatous pyelonephritis?"
        variants:
          - "Does the report describe xanthogranulomatous pyelonephritis?"
        definition: "A chronically infected and destroyed kidney, with a staghorn calculus and inflammatory masses, which the report names xanthogranulomatous pyelonephritis."
      - id: renal_stones_nephrolithiasis
        question: "Are there any renal stones / nephrolithiasis?"
        variants:
          - "Is there a renal calculus or a kidney stone?"
          - "Does the report describe renal stones or nephrolithiasis?"
        definition: "A calculus in the kidney, including the renal pelvis. A stone in a ureter or in the bladder has its own question."
        include_terms:
          - "nephrolithiasis"
          - "renal calculus"
          - "renal stone"
          - "kidney stone"
        exclude_terms:
          - "ureteral stone"
          - "ureterolithiasis"
          - "bladder stone"
      - id: nephrocalcinosis
        question: "Is there nephrocalcinosis?"
        variants:
          - "Does the report describe nephrocalcinosis?"
        definition: "Calcium deposits in the renal parenchyma, medullary or cortical. A calculus in the collecting system has its own question, and vascular calcification does not count."
      - id: polycystic_kidney_disease
        question: "Is there polycystic kidney disease?"
        variants:
          - "Does the report describe polycystic kidney disease?"
        definition: "The report states polycystic kidney disease, or describes innumerable bilateral cysts replacing the renal parenchyma. A few cysts in each kidney do not count."
        include_terms:
          - "polycystic kidney"
          - "ADPKD"
          - "innumerable bilateral renal cysts"
        exclude_terms:
          - "bilateral renal cysts"
          - "multiple renal cysts"
      - id: horseshoe_kidney
        question: "Is there horseshoe kidney?"
        variants:
          - "Does the report describe a horseshoe kidney?"
        definition: "The lower poles of the two kidneys are fused across the midline. A pelvic, ectopic or crossed-fused kidney is a different anomaly."
      - id: renal_cell_carcinoma_rcc
        question: "Are there any renal cell carcinomas?"
        variants:
          - "Does the report describe renal cell carcinoma?"
        definition: "A renal mass the report calls a renal cell carcinoma, or a renal malignancy it names. An uncharacterised renal mass does not count, and neither does a complex cyst."
      - id: renal_lymphoma
        question: "Is there renal lymphoma?"
        variants:
          - "Is there lymphomatous involvement of a kidney?"
          - "Does the report describe renal lymphoma?"
        definition: "Lymphoma involves a kidney: the report names renal lymphoma, or describes renal masses or infiltration in a patient with known lymphoma."
      - id: angiomyolipoma_aml
        question: "Are there any angiomyolipomas?"
        variants:
          - "Does the report describe an angiomyolipoma?"
        definition: "A fat-containing lesion, almost always in the kidney and rarely in the liver. An adrenal myelolipoma is a different lesion in a different organ and has its own question."
        include_terms:
          - "angiomyolipoma"
          - "AML"
          - "fat-containing renal lesion"
        exclude_terms:
          - "myelolipoma"
          - "myolipoma"
          - "adrenal myelolipoma"
      - id: post_nephrectomy
        question: "Are there any post-nephrectomy changes?"
        variants:
          - "Does the report describe post-nephrectomy changes?"
        definition: "Operative change from a nephrectomy: a surgical bed or cavity in the renal fossa, clips or sutures, or a parenchymal defect from a partial nephrectomy. A partial and a total nephrectomy both count, and a kidney the report states was surgically removed counts. An absent kidney alone does not: congenital absence, agenesis, or an absence the report does not explain. A renal allograft has its own question."
      - id: post_renal_transplant
        question: "Are there any post-renal transplantation changes?"
        variants:
          - "Is there a renal allograft?"
          - "Does the report describe post-renal-transplantation changes?"
        definition: "A transplanted kidney in an iliac fossa, or operative change from one. A native kidney surgically removed has its own question."
      - id: renal_subcapsular_hemorrhage
        question: "Are there any renal subcapsular hemorrhages?"
        variants:
          - "Does the report describe renal subcapsular hemorrhage?"
        definition: "Blood lies between the renal capsule and the parenchyma, flattening it. Perinephric blood outside the capsule does not count, and a parenchymal tear has its own question."
      - id: renal_laceration
        question: "Are there any renal lacerations?"
        variants:
          - "Does the report describe renal lacerations?"
        definition: "The renal parenchyma is torn: a laceration, a fracture, or a shattered kidney. A subcapsular or perinephric hematoma with no parenchymal tear has its own question."

      - id: any_kidneys
        question: "Is there any abnormality of the kidneys?"
        variants:
          - "Does the report describe any abnormality of the kidneys?"
        definition: "Anything the report records as abnormal in a kidney, including a finding the specific questions do not cover. Operative change counts, and so does an organ surgically absent. A device alone does not count where the organ is otherwise normal. A normal anatomical variant counts where the report records it. The ureters and the bladder are a separate compartment."
        include_terms:
          - "a renal cyst, hypodensity, mass or angiomyolipoma"
          - "a renal or collecting-system stone"
          - "hydronephrosis"
          - "renal scarring or atrophy"
          - "renal injury, laceration or perinephric hematoma"
          - "a surgically absent kidney, or a transplant kidney"
  Adrenal gland:
    description: "Adrenal gland findings"
    questions:
      - id: adrenal_myelolipoma
        question: "Are there any adrenal myelolipomas?"
        variants:
          - "Does the report describe an adrenal myelolipoma?"
        definition: "A fat-containing lesion in an adrenal gland. A renal angiomyolipoma has its own question, and a soft-tissue myolipoma is a third lesion again."
        include_terms:
          - "myelolipoma"
          - "adrenal myelolipoma"
        exclude_terms:
          - "angiomyolipoma"
          - "myolipoma"

      - id: any_adrenals
        question: "Is there any abnormality of the adrenal glands?"
        variants:
          - "Does the report describe any abnormality of the adrenal glands?"
        definition: "Anything the report records as abnormal in an adrenal gland, including a finding the specific questions do not cover. Operative change counts, and so does an organ surgically absent. A device alone does not count where the organ is otherwise normal. A normal anatomical variant counts where the report records it."
        include_terms:
          - "an adrenal nodule, adenoma or myelolipoma"
          - "an adrenal mass"
          - "adrenal thickening or hyperplasia"
          - "adrenal hemorrhage"
  Gastrointestinal:
    description: "Gastrointestinal findings"
    questions:
      - id: appendicitis
        question: "Is there appendicitis?"
        variants:
          - "Does the report describe appendicitis?"
        definition: "The appendix is inflamed: dilated, with wall thickening, mural hyperenhancement, periappendiceal fat stranding or periappendiceal fluid. A normal appendix does not count, and neither does an appendicolith on its own."
        include_terms:
          - "appendicitis"
          - "acute appendicitis"
          - "inflamed appendix"
          - "appendiceal wall thickening"
          - "periappendiceal inflammatory change"
          - "periappendiceal fluid"
        exclude_terms:
          - "normal appendix"
          - "appendicolith"
          - "post-appendectomy"
          - "appendectomy"
        severity_scale: "the magnitude word the report uses, and whether it describes perforation"
      - id: bowel_obstruction
        question: "Is bowel obstruction present?"
        variants:
          - "Does the report describe bowel obstruction?"
        definition: "The bowel is mechanically obstructed: dilated loops with a transition point or a named cause, or a report naming an obstruction. Dilated loops with no transition point answer the ileus question."
      - id: hiatal_hernia
        question: "Is hiatal hernia present?"
        variants:
          - "Does the report describe a hiatal hernia?"
        definition: "The stomach herniates through the oesophageal hiatus of the diaphragm. A sliding hernia counts and so does a paraoesophageal one."
      - id: ileus
        question: "Is there ileus?"
        variants:
          - "Does the report describe ileus?"
        definition: "The bowel is dilated without a mechanical obstruction: the report names ileus, or describes the bowel as adynamic or paralytic. A transition point or a named obstructing cause answers the bowel obstruction question."
      - id: inguinal_hernias
        question: "Are there any inguinal hernias?"
        variants:
          - "Does the report describe an inguinal hernia?"
        definition: "A hernia through the inguinal canal, direct or indirect, containing fat, bowel or fluid. A femoral, ventral or umbilical hernia is a different site."

      - id: any_bowel
        question: "Is there any abnormality of the stomach or bowel?"
        variants:
          - "Does the report describe any abnormality of the stomach or bowel?"
        definition: "Anything the report records as abnormal in the stomach or the bowel, including a finding the specific questions do not cover. Operative change counts, and so does an organ surgically absent. A device alone does not count where the organ is otherwise normal. A normal anatomical variant counts where the report records it."
        include_terms:
          - "bowel wall thickening"
          - "bowel obstruction or dilated loops"
          - "colitis, enteritis, diverticulitis or appendicitis"
          - "a gastric or bowel mass"
          - "a hiatal hernia, or a hernia containing bowel"
  Device:
    description: "Medical devices/hardware/implants"
    cross_cutting: true
    questions:
      - id: intra_uterine_devices
        question: "Are there any intra-uterine devices?"
        variants:
          - "Does the report describe an intra-uterine device?"
        definition: "A contraceptive device in the uterine cavity. A tubal ligation clip, a pessary and a ureteric stent are other devices."

  Peritoneum:
    description: "Peritoneal cavity findings"
    questions:
      - id: ascites
        question: "Is there any ascites?"
        variants:
          - "Does the report describe ascites?"
        definition: "Free peritoneal fluid that the report does not call blood, from cirrhosis, malignancy or heart failure. Free blood answers the hemoperitoneum question, and fluid the report leaves uncharacterised answers the umbrella question."
        include_terms:
          - "ascites"
          - "ascitic fluid"
        exclude_terms:
          - "hemoperitoneum"
          - "hemorrhagic fluid"
        severity_scale: "the volume word the report uses, such as trace, small, moderate or large"
      - id: free_air_pneumoperitoneum
        question: "Is there any free air or pneumoperitoneum?"
        variants:
          - "Does the report describe free air or pneumoperitoneum?"
        definition: "Gas lies outside the bowel lumen, in the peritoneal cavity. Gas confined to the mesentery counts."
        include_terms:
          - "pneumoperitoneum"
          - "free air"
          - "free intraperitoneal air"
          - "mesenteric free air"
        severity_scale: "the volume word the report uses, such as trace, small, moderate or large"
      - id: pseudomyxoma_peritonei
        question: "Is there pseudomyxoma peritonei?"
        variants:
          - "Does the report describe pseudomyxoma peritonei?"
        definition: "Gelatinous mucinous material fills the peritoneal cavity and scallops the organ surfaces, which the report names pseudomyxoma peritonei. Ascites does not count."
      - id: peritoneal_carcinomatosis
        question: "Is there peritoneal carcinomatosis?"
        variants:
          - "Does the report describe peritoneal carcinomatosis?"
        definition: "Tumour deposits stud the peritoneum as nodules or plaques. Omental caking has its own question, so an infiltrated omentum does not count here."
        include_terms:
          - "peritoneal carcinomatosis"
          - "peritoneal implants"
          - "peritoneal nodularity"
        exclude_terms:
          - "omental caking"

      - id: free_intraperitoneal_fluid
        question: "Is there any free intraperitoneal fluid?"
        variants:
          - "Does the report describe free intraperitoneal fluid?"
        definition: "Fluid lies free in the peritoneal cavity, whatever the report calls it: blood, ascites, bile, urine, enteric content, or fluid it leaves uncharacterised. Any of those answers Yes."
        include_terms:
          - "free fluid"
          - "free intraperitoneal fluid"
          - "intraperitoneal fluid"
          - "fluid in the pelvis"
          - "fluid in Morison's pouch"
          - "perihepatic fluid"
          - "perisplenic fluid"
          - "pelvic free fluid"
          - "hemoperitoneum"
          - "ascites"
        severity_scale: "the volume word the report uses, such as trace, small, moderate or large"
      - id: hemoperitoneum
        question: "Is there hemoperitoneum or free intraperitoneal blood?"
        variants:
          - "Does the report describe hemoperitoneum or free intraperitoneal blood?"
        definition: "The report calls the free intraperitoneal fluid blood -- by that word, by its density, or by the injury it attributes the fluid to. Fluid the report leaves uncharacterised answers the umbrella question instead."
        include_terms:
          - "hemoperitoneum"
          - "intraperitoneal blood"
          - "hemorrhagic free fluid"
          - "high-density free fluid"
          - "hyperdense free fluid"
          - "sentinel clot"
          - "blood products in the peritoneum"
        exclude_terms:
          - "simple fluid"
          - "low-density fluid"
          - "ascites"
        severity_scale: "the volume word the report uses, such as trace, small, moderate or large"
      - id: omental_caking
        question: "Is there omental caking?"
        variants:
          - "Does the report describe omental caking?"
        definition: "Soft tissue replaces the fat of the omentum, as a thickened, nodular or infiltrated omental mass. Discrete peritoneal nodules or plaques elsewhere answer the carcinomatosis question."
        include_terms:
          - "omental caking"
          - "omental cake"
          - "omental thickening"
          - "omental nodularity"
          - "omental infiltration"
          - "infiltrated omentum"
        exclude_terms:
          - "peritoneal carcinomatosis"
          - "peritoneal implants"
          - "peritoneal nodularity"
        severity_scale: "the magnitude word the report uses, such as mild, moderate or marked"
      - id: any_peritoneum
        question: "Is there any abnormality of the peritoneal cavity?"
        variants:
          - "Does the report describe any abnormality of the peritoneal cavity?"
        definition: "Anything the report records as abnormal in the peritoneal cavity, including a finding the specific questions do not cover. Operative change counts, and so does an organ surgically absent. A device alone does not count where the organ is otherwise normal. A normal anatomical variant counts where the report records it. Retroperitoneal fluid or blood answers the retroperitoneum question."
        include_terms:
          - "free intraperitoneal fluid, ascites or hemoperitoneum"
          - "free intraperitoneal air"
          - "peritoneal thickening or enhancement"
          - "a peritoneal deposit or omental caking"
          - "an internal or ventral hernia containing peritoneal contents"
  Great Vessel:
    description: "Vascular findings in the abdomen"
    questions:
      - id: abdominal_aortic_aneurysm_aaa
        question: "Is there an abdominal aortic aneurysm?"
        variants:
          - "Does the report describe an abdominal aortic aneurysm?"
        definition: "The abdominal aorta is aneurysmally dilated: a focal dilation the report calls an aneurysm, or a diameter of 3 cm or more. Ectasia below 3 cm does not count, and neither does atherosclerosis without dilation. A thoracic aneurysm is a different segment."
        include_terms:
