        question: "Is there any free intraperitoneal fluid?"
        variants:
          - "According to the report, is there any free intraperitoneal fluid?"
        definition: "Free intraperitoneal fluid is defined as fluid lying free in the peritoneal cavity, of any kind. This definition includes blood, ascites, bile, urine, enteric content, and fluid of undetermined nature."
        include_terms:
          - "free fluid"
          - "free intraperitoneal fluid"
          - "intraperitoneal fluid"
