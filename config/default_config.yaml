# Model settings
#
# `name` goes into the `model` field of every request, so it should be the
# model the server was launched with.
#
# It said `Qwen/Qwen3-30B-A3B-FP8` until 2026-11-09 and the server has always
# served the bf16 build: FP8 needs Ada or Hopper tensor cores and an A40 is
# Ampere, which is why `README.md` carries a separate four-A40 command without
# the suffix. So the first extraction ran with this field naming a model the
# server was not serving, and produced 2.85 million answers regardless --
# sglang's batch API evidently does not check the name against what it hosts.
# The correction is hygiene rather than a fix for anything that was broken.
#
# **Both runs are therefore the same build**, which is what a comparison
# between them needs: a finding whose answer moves between the two has the new
# wording as its only candidate cause.
model:
  name: "Qwen/Qwen3-30B-A3B"
  # Constrain the questions stage's decoding to the answer schema. Set this to
  # false if `content` comes back empty and the answers are readable only in
  # `reasoning_content`: sglang's grammar backend defers its token mask until
  # the end-of-think token, so a reasoning parser and a schema can fight.
  structured_output: true
  # Qwen3's own thinking-mode settings. The model card gives temperature 0.6,
  # top_p 0.95, top_k 20 and min_p 0, and says not to use greedy decoding
  # because it degrades the output and produces endless repetitions. This was
  # 0.1 / 0.1 through the first extraction, which is near-greedy: the server
  # was generating about 785 tokens per yes/no answer, most of it reasoning
  # that repeated itself.
  #
  # The cost of the change is that sampling is no longer near-deterministic, so
  # two asks of the *same* wording can differ. A finding's three wordings
  # therefore disagree for two reasons now, not one, and the discordance
  # review has to read it that way.
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  min_p: 0
  max_tokens: 4096

# Server settings
server:
  port: 8000
  base_url: "http://127.0.0.1"

# Processing settings
processing:
  batch-size: 1024
  max_retries: 2
  retry_delay: 5
  validation:
    enabled: true
  storage:
    atomic_writes: true
    validate_csv: true

# Generic processing steps that apply to all modalities
prompt_templates:
  remove_comparison: |
    The following report might have references to previous reports or scans (i.e., comes with comparisons). 
    This may be indicated by the presence of a COMPARISON section.  If this is the case, please remove the 
    comparisons from the report and rewrite the sentences to remove comparisons. Go sentence by sentence.
    For sentences without comparisons (e.g., no words such as \"newer\"), output them verbatim without
    changing anything. For sentences with comparisons, minimally rewrite the sentence to remove comparisons.
    Your output should not include words such as \"newer\", \"increased\", or \"improved\"
    that indicate comparisons with previous reports or scans. Please output the raw report without adding other comments 
    in the response. If there are no comparisons in the report, output the raw report without adding other comments.

    {report}

  extract_findings: |
    This is a radiology report:
    {report}

    Please extract the following FINDING section verbatim from the report. 
    It may be called FINDINGS, FINDINGS/IMPRESSIONS, IMPRESSIONS, or not have a section heading. It should give the detailed radiolgist analysis of the contents of the image.
    This section will generally be after the clinical history, after the technical details of image aqusition and before the final sign-off. 
    Remove the section heading but do not omit any part of the radioligst analysis. Put all the extracted content verbatim under section heading called FINDINGS. 
    If there is no findings section, output "No such section". 

  findings_question: |
    Based on the following radiology report:
    {report}

    Question: {question}
    {guidance}
    Answer with a JSON object and nothing else.

    Quote the report rather than paraphrasing it. `evidence` is the one
    sentence that settles the question, verbatim. `certainty_phrase` is the
    hedge the report uses, verbatim and empty if it states the finding flatly.
    `severity_phrase` is the magnitude word it uses, verbatim and empty if it
    gives none. Do not grade the certainty or the severity yourself.

    Answer `not_assessed` if this report cannot answer -- the organ was not
    imaged, or the report defers to another study. That is not the same as `no`.

  map_category_findings: |
    Given the following findings from a radiology report:
    {findings}
    
    Extract and summarize all findings relevant to the {category} category.
    Category description: {description}
    
    If there are no findings relevant to this category, output "No relevant findings".
    Otherwise, provide a concise summary of the findings specific to this category. 
    Reuse language from the report verbatim as much as possible.  Do not add any other comments.

