# Model settings
#
# `name` goes into the `model` field of every request, so it should be the
# model the server was launched with.
#
# It said `Qwen/Qwen3-30B-A3B-FP8` until 2026-11-09 and the server has always
# served the bf16 build: FP8 needs Ada or Hopper tensor cores and an A40 is
# Ampere, which is why `README.md` carries a separate four-A40 command without
# the suffix. So the first extraction ran with this field naming a model the
# server was not serving, and produced 2.85 million answers regardless --
# sglang's batch API evidently does not check the name against what it hosts.
# The correction is hygiene rather than a fix for anything that was broken.
#
# **Both runs are therefore the same build**, which is what a comparison
# between them needs: a finding whose answer moves between the two has the new
# wording as its only candidate cause.
model:
  name: "Qwen/Qwen3-30B-A3B"
  # Constrain the questions stage's decoding to the answer schema.
  #
  # **Off, because thinking is on, and the two cannot both run.** sglang wraps
  # the grammar backend in `ReasonerGrammarBackend` whenever
  # `--reasoning-parser` is set, and that wrapper masks nothing until a
  # `</think>` token, so a schema constrains nothing while the block runs:
  # the 2026-11-13 arm lost 1,637 of 1,800 answers to a block the model never
  # closed. Without the parser the mask applies from the first token instead,
  # which forbids `<think>` and leaves thinking on in name alone. Either way
  # the schema buys nothing here, because the prompt asks for the object and
  # `parse_answer` closes one left open.
  #
  # So the model reasons unconstrained, writes the object because the prompt
  # asks for one, and `strip_reasoning` takes the block off the front of
  # `content`. A malformed answer is then a parse failure the audit counts
  # under `no_verdict`, rather than a silent blank.
  structured_output: false
  # Thinking on, since 2026-11-14. It had been off since `e74ae69`, on the
  # grounds that extraction from a report is close to a lookup and the
  # reasoning block was most of every answer's tokens.
  #
  # A reasoning run and a matched control over the same 18 wordings and 100
  # reports measured what it buys: 1,800 cells, 94 answers gained and 12 lost,
  # and reading both sides' evidence puts about 87 of the 94 right against
  # about 7 wrong. 79 of the 94 are on four compartment probes, where the
  # plain run answered "no abnormality" to the report's own
  # `Vasculature: Mild aortoiliac atherosclerosis` and
  # `Reproductive organs: Prostatomegaly`. That is the inconsistent reading of
  # "abnormal" across 16 probes that the question set's own
  # `aortic_atherosclerosis` finding contradicts at 654 positives.
  #
  # **It applies to every finding.** Running the probes with thinking and the
  # findings without would split one run into two manifests, and `run_guard`
  # compares one decode configuration against one save directory.
  #
  # It costs throughput: 3.24 requests/second against 4.4, so 246 wordings
  # over 12,681 reports is about 11.1 days rather than 8.2.
  #
  # **Launch the server with `launch-server` and no `--reasoning-parser`**,
  # whichever way this goes -- sgl-project #6675 and #9282.
  enable_thinking: true

  # Greedy, since 2026-11-09. This ran at Qwen3's non-thinking 0.7 / 0.8 /
  # 20, and the comment here said a lower temperature was defensible if the
  # answers varied too much between wordings. Two 20-report runs measured
  # that: `aortic_atherosclerosis` answered 4/3/6 Yes under its three
  # wordings and then 1/2/5, with no wording of it changed in between. So the
  # sampler moves answers by about as much as a reworded question does, and
  # the discordance the variants exist to measure cannot be read while both
  # are in it.
  #
  # Greedy stays. The card warns against it in thinking mode, which is now on,
  # and the 2026-11-14 run is the measurement against that warning: 1,728 of
  # its 1,800 answers closed their block and parsed, and the 72 that did not
  # spent a 2,048-token budget, which `max_tokens` below now covers. Greedy
  # also makes a re-run reproduce its labels, which a cohort of 12,681 reports
  # and 3.1M requests wants, and it is what makes a wording's effect
  # attributable at all.
  #
  # `top_p`, `top_k` and `min_p` are inert at temperature 0 and stay here for
  # whoever puts sampling back.
  temperature: 0
  top_p: 0.8
  top_k: 20
  min_p: 0
  # A backstop, not a target. An answer alone is about 80 tokens and 200 at
  # the very most, which is what 512 was sized for. A reasoning block ahead of
  # it runs 400 to 1,100 tokens, and 2,048 was measured short: 72 of the
  # 2026-11-14 arm's 1,800 answers spent the whole budget reasoning and
  # produced no verdict, each one between 8,421 and 9,577 characters. The cap
  # therefore binds on a tail rather than on the usual row, and raising it
  # costs nothing on a generation that stops at the end of its answer.
  max_tokens: 4096

# Server settings
server:
  port: 8000
  base_url: "http://127.0.0.1"

# Processing settings
processing:
  batch-size: 1024
  max_retries: 2
  retry_delay: 5
  validation:
    enabled: true
  storage:
    atomic_writes: true
    validate_csv: true

# Generic processing steps that apply to all modalities
prompt_templates:
  remove_comparison: |
    The following report might have references to previous reports or scans (i.e., comes with comparisons). 
    This may be indicated by the presence of a COMPARISON section.  If this is the case, please remove the 
    comparisons from the report and rewrite the sentences to remove comparisons. Go sentence by sentence.
    For sentences without comparisons (e.g., no words such as \"newer\"), output them verbatim without
    changing anything. For sentences with comparisons, minimally rewrite the sentence to remove comparisons.
    Your output should not include words such as \"newer\", \"increased\", or \"improved\"
    that indicate comparisons with previous reports or scans. Please output the raw report without adding other comments 
    in the response. If there are no comparisons in the report, output the raw report without adding other comments.

    {report}

  extract_findings: |
    This is a radiology report:
    {report}

    Please extract the following FINDING section verbatim from the report. 
    It may be called FINDINGS, FINDINGS/IMPRESSIONS, IMPRESSIONS, or not have a section heading. It should give the detailed radiolgist analysis of the contents of the image.
    This section will generally be after the clinical history, after the technical details of image aqusition and before the final sign-off. 
    Remove the section heading but do not omit any part of the radioligst analysis. Put all the extracted content verbatim under section heading called FINDINGS. 
    If there is no findings section, output "No such section". 

  # The order is deliberate, and it is what prefix caching reads. The static
  # instructions come first, so all 4.3M requests share them; the report comes
  # next, so one report's 339 wordings share it; the question comes last,
  # because it is the only part that differs between them. Written the other
  # way round -- report, question, then the instructions -- nothing after the
  # question can be cached, and a live run showed 57% of the prompt cached and
  # 9.3 requests a second, against 96% and 19.6 on this ordering.
  findings_question: |
    Given a radiology text report, you will be asked about the presence of a
    specific imaging finding and asked to extract verbatim the evidence for your
    answer, as well as phrases on the certainty and severity of the finding.

    Answer about the finding the question names. A sentence may report a second
    finding beside it. That second finding belongs to a different question.

    `answer`
      Answer `yes` when the report states the finding. Answer `no` when the
      report denies the finding, and when the report describes the organ and
      leaves the finding out: "Spleen: Unremarkable" answers `no` for the
      spleen. Answer `not_assessed` when the anatomy lies outside the imaged
      volume, or when the report defers to another study, as in "see CT chest".
      A finding the report leaves out is a `no`.

    `evidence`
      Quote the one sentence that settles the question. On a `no`, quote the
      denial, or the sentence describing the organ as unremarkable.

    `certainty_phrase`
      Quote the hedge the report puts on this finding: "concerning for", "may
      represent". Leave it empty when the report states the finding flatly, and
      when the hedge belongs to a second diagnosis: "hypodensity, likely a cyst"
      hedges the cyst. A comparison with a prior study hedges nothing, so
      "unchanged" and "redemonstrated" leave it empty too.

    `severity_phrase`
      Quote the magnitude: "trace", "13 mm", "too small to characterize",
      "Bosniak III". Quote it by itself,
      so "mildly enlarged" gives "mildly", because "enlarged" names the finding.

    A word about size or amount is a magnitude, so "mildly" and "subcentimeter"
    belong in `severity_phrase`. One phrase belongs to one field. Leave both
    phrases empty unless the answer is `yes`. Do not grade the certainty or the
    severity yourself.

    `attribution`
      `postoperative` when the report ties this finding to a procedure or a
      device: "expected pneumobilia", "postoperative pneumoperitoneum",
      "status post splenectomy". `unknown` when the report says nothing about
      a cause, which is the usual case. Use `spontaneous` only where the
      report states the finding arose without an intervention.

    `named_outright`
      true when the report uses this finding's name or a synonym for it, and
      false when your answer rests on a related sign.

    Report:
    {report}

    Question: {question}
    {guidance}
    Answer with a JSON object and nothing else.

  map_category_findings: |
    Given the following findings from a radiology report:
    {findings}
    
    Extract and summarize all findings relevant to the {category} category.
    Category description: {description}
    
    If there are no findings relevant to this category, output "No relevant findings".
    Otherwise, provide a concise summary of the findings specific to this category. 
    Reuse language from the report verbatim as much as possible.  Do not add any other comments.

